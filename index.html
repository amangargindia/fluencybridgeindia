<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluency Bridge | Directory</title>

    <!-- Tailwind CSS with custom theme -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script> 
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#eff6ff', 100: '#dbeafe', 400: '#60a5fa', 500: '#3b82f6', 600: '#2563eb', 900: '#1e3a8a' },
                        fluency: { 
                            base: '#030712', /* Deepest navy/black */
                            panel: '#0f172a', /* Slightly lighter for sidebars */
                            border: '#1e293b'
                        }
                    }
                }
            }
        }
    </script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Serif font -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- PWA Configuration -->
    <script src="/pwa-setup.js"></script>

    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        body { font-family: 'Inter', sans-serif; }
        
        /* Floating animations */
        @keyframes float { 
            0% { transform: translateY(0px); } 
            50% { transform: translateY(-5px); } 
            100% { transform: translateY(0px); } 
        }
        .hero-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(37,99,235,0.15) 0%, rgba(3,7,18,0) 70%);
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
        }

        .tool-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .tool-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.15), 0 8px 10px -6px rgba(37, 99, 235, 0.1);
        }

        /* Randomizer Slot Machine */
        .slot-machine {
            height: 3.5rem;
            overflow: hidden;
            position: relative;
            mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent);
        }
        .slot-track {
            display: flex;
            flex-direction: column;
            /* The transition duration is set dynamically via JS */
        }
        .slot-item {
            height: 3.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            white-space: normal;
            padding: 0 1rem;
        }
    </style>
</head>

<body class="bg-fluency-base text-slate-300 min-h-screen flex flex-col selection:bg-brand-500 selection:text-white relative overflow-x-hidden">

    <!-- Glowing Background Artifacts -->
    <div class="hero-glow absolute top-[15%] left-1/2 -translate-x-1/2 h-[500px] w-[800px] bg-brand-600/5 blur-[120px] rounded-[100%] pointer-events-none"></div>

    <!-- MAIN CONTENT -->
    <main class="max-w-5xl mx-auto w-full px-6 py-12 lg:py-20 relative z-10 flex-1">
        
        <!-- TOP HERO -->
        <header class="text-center mb-16 relative">
            <h1 class="text-5xl md:text-6xl tracking-tight leading-none mb-2">
                <span class="block text-slate-100 font-extrabold tracking-[0.2em] mb-1">
                    FLUENCY
                </span>
                <span class="block text-white text-[4rem] md:text-[5.5rem] bg-gradient-to-r from-brand-400 to-white bg-clip-text text-transparent pb-2" style="font-family: 'Playfair Display', serif; font-style: italic; font-weight: 600;">
                    bridge
                </span>
            </h1>
            <p class="text-brand-400/80 font-medium tracking-wide uppercase text-xs md:text-sm mt-4 flex items-center justify-center gap-2">
                <i data-lucide="sparkles" class="w-4 h-4 text-brand-500"></i>
                Build precision. Eliminate confusion.
                <i data-lucide="sparkles" class="w-4 h-4 text-brand-500"></i>
            </p>
        </header>

        <!-- FILTERS AND SEARCH -->
        <div class="mb-10 flex flex-col md:flex-row gap-4 max-w-2xl mx-auto">
            <div class="relative flex-1 group">
                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500 group-focus-within:text-brand-400 transition-colors">
                    <i data-lucide="search" class="w-5 h-5"></i>
                </div>
                <input id="search" type="text" placeholder="Search experiences, tools, and tests..."
                    class="w-full bg-fluency-panel border border-fluency-border text-slate-200 placeholder-slate-500 rounded-xl py-3 pl-11 pr-4 focus:ring-2 focus:ring-brand-500/50 focus:border-brand-500 outline-none transition-all shadow-inner">
            </div>
            <div class="relative inline-block w-full md:w-48 group">
                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500 group-focus-within:text-brand-400 transition-colors">
                    <i data-lucide="sort-asc" class="w-4 h-4"></i>
                </div>
                <select id="sort" class="w-full appearance-none bg-fluency-panel border border-fluency-border text-slate-200 rounded-xl py-3 pl-10 pr-10 focus:ring-2 focus:ring-brand-500/50 focus:border-brand-500 outline-none transition-all cursor-pointer font-medium text-sm">
                    <option value="default">Default Sort</option>
                    <option value="az">A → Z</option>
                    <option value="za">Z → A</option>
                </select>
                <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-slate-500">
                    <i data-lucide="chevron-down" class="w-4 h-4"></i>
                </div>
            </div>
        </div>

        <!-- DYNAMIC CARDS CONTAINER -->
        <div id="tools" class="space-y-12">
            <!-- Loading State -->
            <div class="flex justify-center items-center py-20 text-slate-500">
                <i data-lucide="loader-2" class="w-8 h-8 animate-spin text-brand-500"></i>
            </div>
        </div>
    </main>

    <!-- FLOATING CONTACT BUTTON -->
    <a href="/contactus.html" class="fixed bottom-6 right-6 z-40 w-14 h-14 rounded-full bg-brand-600 hover:bg-brand-500 shadow-[0_0_20px_rgba(37,99,235,0.4)] flex items-center justify-center text-2xl transition-all hover:scale-105 active:scale-95 group">
        📞
    </a>

    <!-- FLOATING RANDOM TOPIC BUTTON -->
    <button onclick="openRandomizer()" class="fixed bottom-6 left-6 z-40 w-14 h-14 rounded-full bg-gradient-to-br from-brand-500 to-indigo-600 hover:from-brand-400 hover:to-indigo-500 shadow-[0_0_20px_rgba(79,70,229,0.4)] flex items-center justify-center text-white transition-all hover:scale-105 active:scale-95 group border border-indigo-400/30">
        <i data-lucide="dices" class="w-6 h-6 group-hover:rotate-12 transition-transform"></i>
    </button>

    <!-- RANDOMIZER MODAL OVERLAY -->
    <div id="randomizer-modal" class="fixed inset-0 z-50 bg-fluency-base/80 backdrop-blur-md hidden flex-col items-center justify-center opacity-0 transition-opacity duration-300">
        <div class="relative w-full max-w-md p-8 bg-gradient-to-br from-fluency-panel to-[#0a101f] border border-brand-500/20 rounded-3xl shadow-[0_0_40px_rgba(37,99,235,0.15)] flex flex-col items-center transform scale-95 transition-transform duration-300" id="randomizer-box">
            
            <!-- Close Button -->
            <button onclick="closeRandomizer()" class="absolute top-4 right-4 text-slate-500 hover:text-white transition-colors">
                <i data-lucide="x" class="w-6 h-6"></i>
            </button>

            <!-- Modal Header -->
            <div class="w-16 h-16 bg-brand-900/50 rounded-2xl flex items-center justify-center mb-6 border border-brand-500/30 text-brand-400">
                <i data-lucide="dices" class="w-8 h-8"></i>
            </div>
            <h2 class="text-2xl font-black text-white mb-2 text-center">Random Topic</h2>
            <p class="text-slate-400 text-sm text-center mb-8">Discover a new test from the library. We track your history so you never get repeats!</p>

            <!-- Slot Machine Display -->
            <div class="w-full bg-slate-900/80 border border-slate-700/50 rounded-xl p-4 mb-8 shadow-inner relative">
                <div class="absolute left-0 top-1/2 -translate-y-1/2 w-full h-[3.5rem] border-y border-brand-500/30 bg-brand-500/5 pointer-events-none z-10"></div>
                <div class="slot-machine w-full" id="slot-machine">
                    <div class="slot-track" id="slot-track">
                        <!-- Items injected via JS -->
                    </div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="w-full flex flex-col gap-3">
                <a id="random-start-btn" href="#" class="w-full py-4 rounded-xl bg-brand-600 hover:bg-brand-500 text-white font-bold flex items-center justify-center gap-2 shadow-[0_0_15px_rgba(37,99,235,0.4)] transition-all opacity-50 pointer-events-none">
                    Start Topic <i data-lucide="arrow-right" class="w-5 h-5"></i>
                </a>
                <button onclick="spinRandomizer()" id="random-spin-btn" class="w-full py-4 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold transition-all border border-slate-700/50 flex items-center justify-center gap-2">
                    <i data-lucide="refresh-cw" class="w-4 h-4"></i> Spin Again
                </button>
            </div>
            
            <p class="text-xs text-slate-500 mt-6 text-center" id="random-status-text">Ready to roll.</p>
        </div>
    </div>

    <!-- SCRIPT -->
    <script>
        lucide.createIcons();

        const EXTENSION = ".html";
        const container = document.getElementById("tools");
        const searchInput = document.getElementById("search");
        const sortSelect = document.getElementById("sort");

        let originalData = [];

        // Helper to pick category icons
        function getCategoryIcon(cat) {
            const lc = cat.toLowerCase();
            if (lc.includes("tools")) return "wrench";
            if (lc.includes("test")) return "check-square";
            if (lc.includes("mistake")) return "alert-circle";
            return "folder";
        }

        // Helper to pick tool specific icons (if recognized)
        function getToolIcon(slug) {
            if(slug.includes('vocab')) return "spell-check";
            if(slug.includes('transcription') || slug.includes('audio')) return "mic";
            if(slug.includes('pdf') || slug.includes('epub') || slug.includes('docx')) return "file-text";
            if(slug.includes('mistake')) return "clipboard-x";
            return "package";
        }

        function cleanTitle(rawTitle) {
            let cleaned = rawTitle.replace(/FB Internal Tools\s*-\s*|\s*-\s*FB Internal Tools/gi, '');
            cleaned = cleaned.replace(/Fluency Bridge\s*\|\s*|Fluency Bridge\s*-\s*/gi, '');
            return cleaned.trim();
        }

        function render(data) {
            container.innerHTML = "";

            if(data.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-16 text-slate-500 flex flex-col items-center">
                        <i data-lucide="search-x" class="w-12 h-12 mb-4 text-slate-600"></i>
                        <h3 class="text-lg font-medium text-slate-400">No results found</h3>
                        <p class="text-sm mt-1">Try adjusting your search query.</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            const grouped = {};
            data.forEach(item => {
                const category = item.category || "Other";
                if (!grouped[category]) grouped[category] = [];
                grouped[category].push(item);
            });

            // Sort categories to force 'Tools' to be the very first one
            const sortedCategories = Object.keys(grouped).sort((a, b) => {
                if(a.toLowerCase() === 'tools') return -1;
                if(b.toLowerCase() === 'tools') return 1;
                return a.localeCompare(b);
            });

            sortedCategories.forEach(category => {
                const isTools = category.toLowerCase() === 'tools';
                const section = document.createElement("div");
                section.className = isTools ? "mb-16" : "mb-10 opacity-90";

                const heading = document.createElement("button");
                heading.className = "w-full text-left flex items-center justify-between group border-b border-fluency-border pb-3 mb-6 transition-colors hover:border-brand-500/50 " + (isTools ? "text-2xl font-black text-white" : "text-lg font-bold text-slate-100");
                
                heading.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="p-2 rounded-lg bg-slate-800/50 ${isTools ? 'text-brand-400 border border-brand-500/30' : 'text-slate-400 border border-slate-700/50'} group-hover:bg-brand-900/30 group-hover:text-brand-300 transition-colors">
                            <i data-lucide="${getCategoryIcon(category)}" class="${isTools ? 'w-6 h-6' : 'w-5 h-5'}"></i>
                        </div>
                        <span class="tracking-wide">${category} ${isTools ? '<span class="text-[10px] text-brand-500 ml-2 font-mono uppercase tracking-widest border border-brand-500/30 px-2 py-0.5 rounded-full bg-brand-900/20 align-middle">Primary</span>' : ''}</span>
                        <span class="ml-2 text-[10px] font-medium bg-slate-800 text-slate-400 px-2 py-0.5 rounded-full group-hover:bg-brand-900 group-hover:text-brand-400 transition-colors">${grouped[category].length}</span>
                    </div>
                    <i data-lucide="chevron-down" class="w-5 h-5 text-slate-500 group-hover:text-brand-400 transition-colors"></i>
                `;

                const categoryContentContainer = document.createElement("div");
                categoryContentContainer.className = "transition-all duration-300 transform origin-top";

                heading.addEventListener("click", () => {
                    categoryContentContainer.classList.toggle("hidden");
                    const icon = heading.querySelector('.lucide-chevron-down') || heading.querySelector('.lucide-chevron-up');
                    if(categoryContentContainer.classList.contains("hidden")) {
                        icon.setAttribute('data-lucide', 'chevron-up');
                    } else {
                        icon.setAttribute('data-lucide', 'chevron-down');
                    }
                    lucide.createIcons();
                });

                const subfolders = {};
                grouped[category].forEach(item => {
                    const parts = item.folder ? item.folder.split('/') : [];
                    const subfolderName = parts.length > 1 ? parts.slice(1).join(' / ') : "Main";
                    if (!subfolders[subfolderName]) subfolders[subfolderName] = [];
                    subfolders[subfolderName].push(item);
                });

                Object.keys(subfolders).sort().forEach(subName => {
                    if (subName !== "Main" || Object.keys(subfolders).length > 1) {
                        const subHeading = document.createElement("h4");
                        subHeading.className = "text-sm font-semibold text-brand-400 mb-4 mt-8 uppercase tracking-wider pl-3 border-l-2 border-brand-500/50 flex items-center gap-2";
                        subHeading.innerHTML = `<i data-lucide="folder-tree" class="w-4 h-4"></i> ${subName === "Main" ? category : subName}`;
                        categoryContentContainer.appendChild(subHeading);
                    } else if (subName !== "Main") {
                        // just in case
                        const subHeading = document.createElement("h4");
                        subHeading.className = "text-sm font-semibold text-brand-400 mb-4 mt-8 uppercase tracking-wider pl-3 border-l-2 border-brand-500/50";
                        subHeading.innerText = subName;
                        categoryContentContainer.appendChild(subHeading);
                    }

                    const grid = document.createElement("div");
                    grid.className = isTools 
                        ? "grid grid-cols-1 md:grid-cols-2 gap-6" 
                        : "grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4";

                    subfolders[subName].forEach(item => {
                        const url = (item.folder ? item.folder + "/" : "") + item.slug + EXTENSION;
                        const cleanName = cleanTitle(item.title);
                        
                        const card = document.createElement("a");
                        card.href = url;
                        card.className = isTools 
                            ? "tool-card block p-6 md:p-8 bg-gradient-to-br from-fluency-panel to-[#0a101f] border border-brand-500/20 rounded-2xl group flex flex-col justify-between h-full relative overflow-hidden shadow-[0_4px_20px_rgba(0,0,0,0.4)] hover:border-brand-400 hover:shadow-[0_0_25px_rgba(37,99,235,0.2)]"
                            : "tool-card block p-5 bg-fluency-panel border border-fluency-border rounded-xl group flex flex-col justify-between h-full relative overflow-hidden";
                        
                        card.innerHTML = `
                            ${isTools ? '<div class="absolute -right-10 -top-10 w-40 h-40 bg-brand-600/10 rounded-full blur-3xl group-hover:bg-brand-500/20 transition-colors"></div>' : '<div class="absolute -right-4 -top-4 w-24 h-24 bg-brand-600/5 rounded-full blur-xl group-hover:bg-brand-500/10 transition-colors"></div>'}
                            <div>
                                <div class="${isTools ? 'w-12 h-12 bg-brand-900/50 text-brand-400 mb-5 border-brand-500/30' : 'w-10 h-10 bg-slate-800/80 text-slate-400 mb-4 border-slate-700/50'} rounded-xl border flex items-center justify-center group-hover:scale-110 group-hover:bg-brand-600 group-hover:text-white transition-all shadow-sm">
                                    <i data-lucide="${getToolIcon(item.slug)}" class="${isTools ? 'w-6 h-6' : 'w-5 h-5'}"></i>
                                </div>
                                <h2 class="${isTools ? 'text-xl md:text-2xl font-black text-white' : 'text-[1.05rem] font-bold text-slate-200'} mb-2 group-hover:text-brand-300 transition-colors leading-snug">
                                    ${cleanName}
                                </h2>
                            </div>
                            <div class="mt-6 flex items-center gap-1.5 ${isTools ? 'text-sm' : 'text-xs md:text-xs'} font-semibold text-brand-500 translate-y-1 group-hover:translate-y-0 opacity-80 group-hover:opacity-100 transition-all">
                                Access ${isTools ? 'Workspace' : 'Portal'} <i data-lucide="arrow-right" class="w-4 h-4 group-hover:translate-x-1 transition-transform"></i>
                            </div>
                        `;
                        grid.appendChild(card);
                    });
                    categoryContentContainer.appendChild(grid);
                });

                section.appendChild(heading);
                section.appendChild(categoryContentContainer);
                container.appendChild(section);
            });
            
            // Re-bind Lucide icons for dynamically added content
            lucide.createIcons();
        }

        function applyFilters() {
            let filtered = [...originalData];
            const query = searchInput.value.toLowerCase();
            
            if (query) {
                filtered = filtered.filter(item => item.title.toLowerCase().includes(query) || (item.category && item.category.toLowerCase().includes(query)) || (item.slug && item.slug.toLowerCase().includes(query)));
            }
            if (sortSelect.value === "az") {
                filtered.sort((a, b) => a.title.localeCompare(b.title));
            } else if (sortSelect.value === "za") {
                filtered.sort((a, b) => b.title.localeCompare(a.title));
            }
            render(filtered);
        }

        searchInput.addEventListener("input", applyFilters);
        sortSelect.addEventListener("change", applyFilters);

        // Fetch Tools list
        fetch('./index.json?_t=' + new Date().getTime()) // Anti-cache query param added here for absolute safety
            .then(res => {
                if(!res.ok) throw new Error("JSON not found");
                return res.json();
            })
            .then(data => {
                originalData = data;
                render(originalData);
            })
            .catch(err => {
                console.error("Error loading JSON:", err);
                container.innerHTML = `
                    <div class="text-center py-16 text-slate-500 border border-slate-700/50 bg-slate-800/20 rounded-2xl mx-auto max-w-lg">
                        <i data-lucide="alert-triangle" class="w-10 h-10 mb-3 mx-auto text-red-400"></i>
                        <h3 class="text-lg font-medium text-slate-300">Failed to load tools</h3>
                        <p class="text-sm mt-1 text-slate-400">Please ensure index.json exists and is readable.</p>
                    </div>
                `;
                lucide.createIcons();
            });
        // --- RANDOMIZER LOGIC ---
        const randomModal = document.getElementById('randomizer-modal');
        const randomBox = document.getElementById('randomizer-box');
        const slotTrack = document.getElementById('slot-track');
        const startBtn = document.getElementById('random-start-btn');
        const spinBtn = document.getElementById('random-spin-btn');
        const statusText = document.getElementById('random-status-text');

        let isSpinning = false;
        let testItems = [];

        function getTestHistory() {
            try {
                return JSON.parse(localStorage.getItem('fluency_history')) || [];
            } catch(e) { return []; }
        }

        function setTestHistory(history) {
            localStorage.setItem('fluency_history', JSON.stringify(history));
        }

        function openRandomizer() {
            randomModal.classList.remove('hidden');
            randomModal.classList.add('flex');
            setTimeout(() => {
                randomModal.classList.remove('opacity-0');
                randomBox.classList.remove('scale-95');
                randomBox.classList.add('scale-100');
            }, 10);
            
            testItems = originalData.filter(item => item.category === 'Tests');
            
            // Setup initial track state if empty
            if (slotTrack.children.length === 0) {
                slotTrack.innerHTML = '<div class="slot-item text-slate-500 font-medium">Click Spin Again to roll</div>';
                slotTrack.style.transform = 'translateY(0)';
            }
        }

        function closeRandomizer() {
            if(isSpinning) return; 
            randomModal.classList.add('opacity-0');
            randomBox.classList.remove('scale-100');
            randomBox.classList.add('scale-95');
            setTimeout(() => {
                randomModal.classList.add('hidden');
                randomModal.classList.remove('flex');
            }, 300);
        }

        function spinRandomizer() {
            if (isSpinning || testItems.length === 0) return;
            isSpinning = true;
            spinBtn.classList.add('opacity-50', 'pointer-events-none');
            startBtn.classList.add('opacity-50', 'pointer-events-none');
            startBtn.href = "#";

            let history = getTestHistory();
            let unseen = testItems.filter(item => !history.includes(item.slug));
            
            if (unseen.length === 0) {
                history = [];
                setTestHistory(history);
                unseen = [...testItems];
                statusText.innerText = "Wow! You've seen them all. Resetting history!";
            } else {
                statusText.innerText = `Finding 1 of ${unseen.length} unseen tests...`;
            }

            const winner = unseen[Math.floor(Math.random() * unseen.length)];
            
            slotTrack.innerHTML = '';
            slotTrack.style.transition = 'none';
            slotTrack.style.transform = 'translateY(0)';

            const spinDuration = 3000;
            const totalItemsInTrack = 30;
            
            for(let i=0; i<totalItemsInTrack; i++) {
                const div = document.createElement('div');
                div.className = 'slot-item text-lg md:text-xl font-bold text-slate-200 px-4';
                
                if (i === totalItemsInTrack - 1) {
                    div.innerText = cleanTitle(winner.title);
                    div.classList.add('text-brand-400');
                } else {
                    const randomDummy = testItems[Math.floor(Math.random() * testItems.length)];
                    div.innerText = cleanTitle(randomDummy.title);
                }
                slotTrack.appendChild(div);
            }

            void slotTrack.offsetWidth;

            slotTrack.style.transition = `transform ${spinDuration}ms cubic-bezier(0.15, 0.85, 0.15, 1)`;
            slotTrack.style.transform = `translateY(-${(totalItemsInTrack - 1) * 3.5}rem)`;

            setTimeout(() => {
                isSpinning = false;
                spinBtn.classList.remove('opacity-50', 'pointer-events-none');
                startBtn.classList.remove('opacity-50', 'pointer-events-none');
                
                const url = (winner.folder ? winner.folder + "/" : "") + winner.slug + EXTENSION;
                startBtn.href = url;
                
                history.push(winner.slug);
                setTestHistory(history);
                
                statusText.innerHTML = `<span class="text-brand-400 font-semibold">Ready!</span> Topic saved to history.`;
            }, spinDuration + 100);
        }
            
    </script>
</body>
</html>
