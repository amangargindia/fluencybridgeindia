        function navigate(viewId, isBack = false) {
            // Update Top Nav Styling
            ['read', 'vocab', 'grammar', 'quiz'].forEach(navId => {
                const el = document.getElementById(`nav-${navId}`);
                if (navId === viewId) {
                    el.classList.add('text-[#2563EB]', 'border-[#2563EB]');
                    el.classList.remove('text-gray-500', 'border-transparent');
                } else {
                    el.classList.remove('text-[#2563EB]', 'border-[#2563EB]');
                    el.classList.add('text-gray-500', 'border-transparent');
                }
            });

            // Hide all views
            ['view-read', 'view-vocab', 'view-grammar', 'view-quiz'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });

            // Show target view with animation
            const targetView = document.getElementById(`view-${viewId}`);
            targetView.classList.remove('hidden');
            targetView.classList.remove('fade-in');
            void targetView.offsetWidth; // Reflow
            targetView.classList.add('fade-in');

            // Manage History
            if (!isBack && historyStack[historyStack.length - 1] !== viewId) {
                historyStack.push(viewId);
            }

            updateFooter();
            window.scrollTo(0, 0);

            // Init Views
            if (viewId === 'vocab') renderMainVocab();
            if (viewId === 'grammar') renderMainGrammar();
            if (viewId === 'quiz') startQuiz();
        }

        function goBack() {
            if (historyStack.length > 1) {
                historyStack.pop();
                const prev = historyStack[historyStack.length - 1];
                navigate(prev, true);
            }
        }

        function updateFooter() {
            const btnBack = document.getElementById('btn-back');
            if (historyStack.length > 1) {
                btnBack.classList.remove('opacity-50', 'pointer-events-none');
            } else {
                btnBack.classList.add('opacity-50', 'pointer-events-none');
            }
        }

        // --- RENDER READ ARTICLE (Phrasal Blocks) ---
        function initArticle() {
            const container = document.getElementById('article-container');
            articleData.forEach((sentence, sIdx) => {
                const p = document.createElement('p');
                p.className = 'mb-6 leading-loose';
                
                sentence.phrases.forEach((phrase) => {
                    const span = document.createElement('span');
                    span.className = 'phrase-chunk text-gray-300 mr-1.5';
                    span.innerText = phrase.text;
                    span.onclick = () => openPhraseModal(sentence, phrase);
                    p.appendChild(span);
                });
                
                container.appendChild(p);
            });
        }

        // --- MODAL LOGIC (Phrase vs Sentence) ---
        function openPhraseModal(sentence, phrase) {
            document.body.style.overflow = 'hidden';
            activeSentenceData = sentence;
            activePhraseData = phrase;
            modalMode = 'phrase';
            
            // Show Full Sentence button when in phrase mode
            document.getElementById('full-sentence-btn-container').classList.remove('hidden');
            
            renderModalContent();
            document.getElementById('phrase-modal').classList.remove('hidden');
        }

        function showFullSentence() {
            modalMode = 'sentence';
            // Hide the button since we are already in full sentence mode
            document.getElementById('full-sentence-btn-container').classList.add('hidden');
            renderModalContent();
            
            // Scroll to top of modal
            document.getElementById('modal-scroll-area').scrollTop = 0;
        }

        function switchModalTab(tab) {
            modalTab = tab;
            
            // Update styling
            const vBtn = document.getElementById('tab-vocab');
            const gBtn = document.getElementById('tab-grammar');
            
            if (tab === 'vocab') {
                vBtn.classList.add('text-[#2563EB]', 'border-[#2563EB]');
                vBtn.classList.remove('text-gray-500', 'border-transparent');
                gBtn.classList.add('text-gray-500', 'border-transparent');
                gBtn.classList.remove('text-[#2563EB]', 'border-[#2563EB]');
                
                document.getElementById('modal-vocab-content').classList.remove('hidden');
                document.getElementById('modal-grammar-content').classList.add('hidden');
            } else {
                gBtn.classList.add('text-[#2563EB]', 'border-[#2563EB]');
                gBtn.classList.remove('text-gray-500', 'border-transparent');
                vBtn.classList.add('text-gray-500', 'border-transparent');
                vBtn.classList.remove('text-[#2563EB]', 'border-[#2563EB]');
                
                document.getElementById('modal-grammar-content').classList.remove('hidden');
                document.getElementById('modal-vocab-content').classList.add('hidden');
            }
        }

        function renderModalContent() {
            const headerText = document.getElementById('modal-header-text');
            const vocabContainer = document.getElementById('modal-vocab-content');
            const grammarContainer = document.getElementById('modal-grammar-content');
            
            let vocabData = [];
            let grammarData = [];

            if (modalMode === 'phrase') {
                headerText.innerText = activePhraseData.text;
                vocabData = activePhraseData.vocab || [];
                grammarData = activePhraseData.grammar || [];
            } else {
                // Aggregate everything for the full sentence
                headerText.innerText = activeSentenceData.fullText;
                vocabData = activeSentenceData.phrases.flatMap(p => p.vocab || []);
                grammarData = activeSentenceData.phrases.flatMap(p => p.grammar || []);
            }

            // Render Vocab
            if (vocabData.length === 0) {
                vocabContainer.innerHTML = `<p class="text-gray-500 text-center py-6 italic text-sm">No complex vocabulary found in this selection.</p>`;
            } else {
                let vHtml = '';
                vocabData.forEach(v => {
                    vHtml += `
                        <div class="bg-[#111A2C] rounded-xl p-4 border-l-2 border-[#2563EB]">
                            <div class="flex justify-between items-center mb-1">
                                <span class="font-bold text-white text-lg">${v.word}</span>
                                <span class="text-[10px] bg-black/30 px-2 py-1 rounded text-gray-400 border border-white/5 uppercase tracking-wide">${v.pos}</span>
                            </div>
                            <p class="text-sm text-[#2563EB] mb-2 font-medium">${v.meaning}</p>
                            <p class="text-xs text-gray-300 leading-relaxed mb-2"><span class="font-bold text-gray-500">In Context:</span> ${v.context}</p>
                            <p class="text-xs text-gray-400 leading-relaxed italic border-t border-white/5 pt-2"><span class="font-bold text-gray-500 not-italic">Example:</span> "${v.usage}"</p>
                        </div>
                    `;
                });
                vocabContainer.innerHTML = vHtml;
            }

            // Render Grammar
            if (grammarData.length === 0) {
                grammarContainer.innerHTML = `<p class="text-gray-500 text-center py-6 italic text-sm">No specific grammar rules highlighted in this selection.</p>`;
            } else {
                let gHtml = '';
                grammarData.forEach(g => {
                    gHtml += `
                        <div class="bg-[#111A2C] rounded-xl p-4 border-l-2 border-purple-500">
                            <span class="font-bold text-white block text-md mb-2">${g.topic}</span>
                            <p class="text-sm text-gray-300 mb-2 leading-relaxed">${g.desc}</p>
                            <p class="text-xs text-gray-400 leading-relaxed mb-2"><span class="font-bold text-gray-500">In Context:</span> ${g.inSentence}</p>
                            <p class="text-xs text-gray-400 leading-relaxed italic border-t border-white/5 pt-2"><span class="font-bold text-gray-500 not-italic">Example:</span> "${g.usage}"</p>
                        </div>
                    `;
                });
                grammarContainer.innerHTML = gHtml;
            }

            // Ensure correct tab is visible
            switchModalTab(modalTab);
        }

        function closeModal() {
            document.body.style.overflow = '';
            document.getElementById('phrase-modal').classList.add('hidden');
        }

        // --- ACCORDION FOR MAIN VIEWS ---
        function toggleAccordion(id, iconId) {
            const content = document.getElementById(id);
            const icon = document.getElementById(iconId);
            if (content.classList.contains('expanded')) {
                content.classList.remove('expanded');
                icon.classList.remove('rotate-180');
            } else {
                content.classList.add('expanded');
                icon.classList.add('rotate-180');
            }
        }

        function renderMainVocab() {
            const container = document.getElementById('main-vocab-container');
            if (container.children.length > 0) return;

            allVocab.forEach((v, idx) => {
                const contentId = `mv-content-${idx}`;
                const iconId = `mv-icon-${idx}`;
                
                container.insertAdjacentHTML('beforeend', `
                    <div class="bg-[#111A2C] border-t border-white/5 rounded-2xl shadow-lg overflow-hidden">
                        <button onclick="toggleAccordion('${contentId}', '${iconId}')" class="w-full p-5 flex justify-between items-center hover:bg-white/5 transition text-left">
                            <div>
                                <h3 class="text-lg font-bold text-white">${v.word}</h3>
                                <p class="text-sm text-[#2563EB] mt-1">${v.meaning}</p>
                            </div>
                            <div class="bg-[#080D1A] p-2 rounded-full border border-white/5 shrink-0 transition-transform duration-300" id="${iconId}">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="#9ca3af" viewBox="0 0 256 256"><path d="M213.66,101.66l-80,80a8,8,0,0,1-11.32,0l-80-80A8,8,0,0,1,53.66,90.34L128,164.69l74.34-74.35a8,8,0,0,1,11.32,11.32Z"></path></svg>
                            </div>
                        </button>
                        <div id="${contentId}" class="accordion-content bg-[#080D1A] px-5 pb-5">
                            <div class="pt-4 border-t border-white/5 space-y-3">
                                <div><span class="text-[10px] uppercase tracking-widest text-gray-500 font-bold block mb-1">Part of Speech</span><span class="text-sm text-gray-300 bg-white/5 px-2 py-1 rounded inline-block">${v.pos}</span></div>
                                <div><span class="text-[10px] uppercase tracking-widest text-gray-500 font-bold block mb-1">Context</span><span class="text-sm text-gray-300 leading-relaxed block">${v.context}</span></div>
                                <div><span class="text-[10px] uppercase tracking-widest text-gray-500 font-bold block mb-1">Example</span><span class="text-sm text-gray-400 italic block border-l-2 border-white/10 pl-3 py-1">"${v.usage}"</span></div>
                            </div>
                        </div>
                    </div>
                `);
            });
        }

        function renderMainGrammar() {
            const container = document.getElementById('main-grammar-container');
            if (container.children.length > 0) return;

            allGrammar.forEach((g, idx) => {
                const contentId = `mg-content-${idx}`;
                const iconId = `mg-icon-${idx}`;
                
                container.insertAdjacentHTML('beforeend', `
                    <div class="bg-[#111A2C] border-t border-white/5 rounded-2xl shadow-lg overflow-hidden border-l-4 border-l-purple-500">
                        <button onclick="toggleAccordion('${contentId}', '${iconId}')" class="w-full p-5 flex justify-between items-center hover:bg-white/5 transition text-left">
                            <h3 class="text-md font-bold text-white pr-4 leading-tight">${g.topic}</h3>
                            <div class="bg-[#080D1A] p-2 rounded-full border border-white/5 shrink-0 transition-transform duration-300" id="${iconId}">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="#9ca3af" viewBox="0 0 256 256"><path d="M213.66,101.66l-80,80a8,8,0,0,1-11.32,0l-80-80A8,8,0,0,1,53.66,90.34L128,164.69l74.34-74.35a8,8,0,0,1,11.32,11.32Z"></path></svg>
                            </div>
                        </button>
                        <div id="${contentId}" class="accordion-content bg-[#080D1A] px-5 pb-5">
                            <div class="pt-4 border-t border-white/5 space-y-4">
                                <p class="text-sm text-gray-300 leading-relaxed">${g.desc}</p>
                                <div class="bg-white/5 p-4 rounded-xl border border-white/5">
                                    <span class="text-[10px] uppercase tracking-widest text-gray-500 font-bold block mb-1">Article Context</span>
                                    <span class="text-sm text-gray-200 leading-relaxed">${g.inSentence}</span>
                                </div>
                                <div class="pl-3 border-l-2 border-purple-500/50">
                                    <span class="text-[10px] uppercase tracking-widest text-gray-500 font-bold block mb-1">General Example</span>
                                    <span class="text-sm text-gray-400 italic">"${g.usage}"</span>
                                </div>
                            </div>
                        </div>
                    </div>
                `);
            });
        }

        // --- QUIZ ENGINE ---
        function startQuiz() {
            if (quizState.current === 0) quizState.score = 0;
            renderQuizQuestion();
        }

        function renderQuizQuestion() {
            const container = document.getElementById('quiz-card');
            const pText = document.getElementById('quiz-progress-text');
            const pBar = document.getElementById('quiz-progress-bar');
            
            if (quizState.current >= quizData.length) {
                pText.innerText = `Done!`;
                pBar.style.width = `100%`;
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center flex-1 text-center py-8 fade-in">
                        <div class="w-20 h-20 bg-green-500/20 rounded-full flex items-center justify-center mb-6">
                            <span class="text-4xl">🏆</span>
                        </div>
                        <h3 class="text-2xl font-bold text-white mb-3">Quiz Complete!</h3>
                        <p class="text-gray-400 mb-8 text-lg">Score: <span class="text-white font-bold">${quizState.score}</span> / ${quizData.length - 5} <span class="text-sm block mt-1">(Flashcards excluded)</span></p>
                        <button onclick="quizState.current=0; navigate('quiz');" class="bg-[#111A2C] border border-white/10 text-white px-8 py-4 rounded-xl font-bold hover:bg-[#152136] transition-colors w-full mb-3">Retake Assessment</button>
                        <button onclick="navigate('read')" class="bg-[#2563EB] text-white px-8 py-4 rounded-xl font-bold hover:bg-blue-600 transition-colors w-full">Return to Reader</button>
                    </div>
                `;
                return;
            }

            const q = quizData[quizState.current];
            pText.innerText = `${quizState.current + 1}/${quizData.length}`;
            pBar.style.width = `${((quizState.current) / quizData.length) * 100}%`;

            container.innerHTML = '';

            if (q.type === 'flashcard') {
                container.innerHTML = `
                    <div class="flex flex-col flex-1 fade-in">
                        <span class="text-[10px] tracking-widest uppercase text-[#2563EB] font-bold mb-6">Flashcard Review</span>
                        <div class="flex-1 flex items-center justify-center min-h-[220px] bg-[#080D1A] rounded-2xl border border-white/10 mb-6 p-6 text-center relative overflow-hidden cursor-pointer shadow-inner group" onclick="flipCard()">
                            <h3 id="fc-term" class="text-4xl font-bold text-white group-hover:scale-105 transition-transform duration-300">${q.term}</h3>
                            <div id="fc-ans" class="hidden absolute inset-0 bg-[#2563EB] p-6 flex flex-col items-center justify-center modal-enter">
                                <span class="text-[10px] uppercase tracking-widest text-white/70 mb-3 font-bold">Meaning</span>
                                <p class="text-xl font-bold text-white text-center leading-relaxed">${q.answer}</p>
                            </div>
                        </div>
                        <button id="fc-btn" onclick="flipCard()" class="bg-[#111A2C] border border-white/10 text-white w-full py-4 rounded-xl font-bold hover:bg-[#152136] hover:border-white/30 transition-all mt-auto shadow-lg">Tap to Reveal</button>
                    </div>
                `;
            } else if (q.type === 'tf') {
                container.innerHTML = `
                    <div class="flex flex-col flex-1 fade-in">
                        <span class="text-[10px] tracking-widest uppercase text-purple-500 font-bold mb-6">True or False Analysis</span>
                        <h3 class="text-xl font-bold text-white mb-8 leading-relaxed">${q.question}</h3>
                        <div class="space-y-4 mb-6" id="tf-options">
                            <button onclick="checkAnswer(true, this)" class="w-full text-left bg-[#080D1A] border border-white/10 rounded-xl p-5 hover:bg-white/10 transition-colors text-white font-medium text-lg">True</button>
                            <button onclick="checkAnswer(false, this)" class="w-full text-left bg-[#080D1A] border border-white/10 rounded-xl p-5 hover:bg-white/10 transition-colors text-white font-medium text-lg">False</button>
                        </div>
                        <div id="explanation-box" class="hidden bg-[#080D1A] border border-white/5 rounded-xl p-5 mb-4 modal-enter"></div>
                        <button id="next-btn" onclick="nextQuestion()" class="hidden bg-[#2563EB] text-white w-full py-4 rounded-xl font-bold hover:bg-blue-600 transition-all mt-auto shadow-lg">Continue to Next</button>
                    </div>
                `;
            } else if (q.type === 'mcq') {
                let optionsHtml = '';
                q.options.forEach((opt, idx) => {
                    optionsHtml += `<button onclick="checkAnswer(${idx}, this)" class="w-full text-left bg-[#080D1A] border border-white/10 rounded-xl p-5 hover:bg-white/10 transition-colors text-gray-200 hover:text-white text-md mb-4 leading-relaxed">${opt}</button>`;
                });
                
                container.innerHTML = `
                    <div class="flex flex-col flex-1 fade-in">
                        <span class="text-[10px] tracking-widest uppercase text-green-500 font-bold mb-6">Comprehension Check</span>
                        <h3 class="text-xl font-bold text-white mb-8 leading-relaxed">${q.question}</h3>
                        <div id="mcq-options">${optionsHtml}</div>
                        <div id="explanation-box" class="hidden bg-[#080D1A] border border-white/5 rounded-xl p-5 mb-4 modal-enter"></div>
                        <button id="next-btn" onclick="nextQuestion()" class="hidden bg-[#2563EB] text-white w-full py-4 rounded-xl font-bold hover:bg-blue-600 transition-all mt-auto shadow-lg">Continue to Next</button>
                    </div>
                `;
            }
        }

        window.flipCard = function() {
            const ans = document.getElementById('fc-ans');
            const btn = document.getElementById('fc-btn');
            if (ans.classList.contains('hidden')) {
                ans.classList.remove('hidden');
                btn.innerText = "Got it! Next Question";
                btn.classList.remove('bg-[#111A2C]', 'border-white/10');
                btn.classList.add('bg-[#2563EB]');
                btn.onclick = window.nextQuestion;
            }
        };

        window.checkAnswer = function(selected, btnElement) {
            const q = quizData[quizState.current];
            const isCorrect = (q.type === 'tf' && selected === q.correct) || (q.type === 'mcq' && selected === q.correctIndex);
            
            const parent = btnElement.parentElement;
            Array.from(parent.children).forEach(child => {
                child.disabled = true;
                child.classList.add('opacity-50', 'pointer-events-none');
            });

            btnElement.classList.remove('opacity-50', 'bg-[#080D1A]', 'hover:bg-white/10', 'text-gray-200');
            if (isCorrect) {
                btnElement.classList.add('bg-green-500/20', 'border-green-500', 'text-green-400');
                quizState.score++;
            } else {
                btnElement.classList.add('bg-red-500/20', 'border-red-500', 'text-red-400');
            }

            const expBox = document.getElementById('explanation-box');
            expBox.classList.remove('hidden');
            expBox.innerHTML = `
                <span class="text-xs uppercase tracking-widest font-bold block mb-2 ${isCorrect ? 'text-green-400' : 'text-red-400'}">${isCorrect ? 'Correct!' : 'Incorrect'}</span>
                <p class="text-sm text-gray-300 leading-relaxed">${q.explanation}</p>
            `;

            document.getElementById('next-btn').classList.remove('hidden');
        };

        window.nextQuestion = function() {
            quizState.current++;
            renderQuizQuestion();
        };

        // --- INIT ---
        window.onload = () => {
            initArticle();
            updateFooter();
        };

    </script>
</body>
</html>
