<!DOCTYPE html>

<body class="min-h-screen relative overflow-x-hidden selection:bg-blue-500/30">

    <script>
        // --- DATA GENERATION LAYER ---
        
        const concepts = [
            { c: 'city', p: 'Mumbai' }, { c: 'boy', p: 'Rahul' }, { c: 'biscuit', p: 'Parle-G' },
            { c: 'car', p: 'Tata Nexon' }, { c: 'festival', p: 'Diwali' }, { c: 'month', p: 'January' },
            { c: 'school', p: 'Delhi Public School' }, { c: 'river', p: 'Ganga' }, { c: 'shoes', p: 'Bata' },
            { c: 'country', p: 'India' }, { c: 'actor', p: 'Shahrukh Khan' }, { c: 'monument', p: 'Taj Mahal' }
        ];

        // 1. Generate 100 Quiz Questions
        const quizBank = [];
        const generateQuizData = () => {
            // Hardcoded premium reasoning questions
            quizBank.push({
                type: 'reasoning', q: "Explain why 'I saw a Doctor' is incorrect.",
                options: ["Doctor is a verb", "Doctor is a common noun here", "Doctor is spelled wrong"], correct: 1,
                exp: "Yahan 'doctor' ek common noun hai (aam naam). Jab tak hum kisi specific doctor ka naam (e.g., Doctor Sharma) nahi lete, tab tak use Capital letter se start nahi karna chahiye. Sahi: 'I saw a doctor'."
            });
            quizBank.push({
                type: 'correct_not', q: "Is this correct? 'we went to delhi by train.'",
                options: ["Correct", "Not Correct"], correct: 1,
                exp: "Not Correct. 'delhi' ek proper noun hai (khas shehar ka naam), isliye iska pehla letter hamesha Capital hona chahiye: 'Delhi'. Sentence ka pehla letter 'We' bhi capital hona chahiye."
            });
            quizBank.push({
                type: 'mcq', q: "Which of the following is entirely made of Proper Nouns?",
                options: ["Dog, Cat, Mouse", "Amit, Ganga, Sunday", "City, Mumbai, State"], correct: 1,
                exp: "Amit (khas insaan), Ganga (khas nadi), Sunday (khas din). Baki options mein aam naam (common nouns) mix hain."
            });

            // Programmatically generate the rest to hit 100
            let counter = quizBank.length;
            while (counter < 100) {
                let pair = concepts[counter % concepts.length];
                let isProper = Math.random() > 0.5;
                let targetWord = isProper ? pair.p : pair.c;
                
                if (counter % 4 === 0) {
                    quizBank.push({
                        type: 'mcq',
                        q: `Identify the Proper Noun in this list: ${pair.c}, book, ${pair.p}, table.`,
                        options: [pair.c, "book", pair.p],
                        correct: 2,
                        exp: `'${pair.p}' ek specific (khas) naam hai, isliye ye proper noun hai.`
                    });
                } else if (counter % 4 === 1) {
                    quizBank.push({
                        type: 'tf',
                        q: `True/False: The word '${targetWord}' is a ${isProper ? 'Proper' : 'Common'} Noun.`,
                        options: ["True", "False"],
                        correct: 0,
                        exp: `True. '${targetWord}' ek ${isProper ? 'khas' : 'aam'} naam hai.`
                    });
                } else if (counter % 4 === 2) {
                    let incorrectTarget = isProper ? pair.p.toLowerCase() : pair.c;
                    quizBank.push({
                        type: 'correct_not',
                        q: `Is the capitalization correct? "I love my ${incorrectTarget}."`,
                        options: ["Correct", "Not Correct"],
                        correct: isProper ? 1 : 0,
                        exp: isProper ? `Not Correct. '${pair.p}' proper noun hai, Capital se start hona chahiye.` : `Correct. '${pair.c}' common noun hai, small letter theek hai (unless sentence ke start mein ho).`
                    });
                } else {
                    quizBank.push({
                        type: 'reasoning',
                        q: `Why do we capitalize '${pair.p}' but not '${pair.c}'?`,
                        options: ["It is a naming rule", "Proper nouns need capitals", "Both should be capitalized"],
                        correct: 1,
                        exp: "English grammar ka strict rule hai: Proper nouns (specific names) hamesha Capital letter se start hote hain."
                    });
                }
                counter++;
            }
        };

        // 2. Generate 50 Real Life Scenarios
        const realLifeScenarios = [];
        const generateRealLifeData = () => {
            const base = [
                { context: "Buying groceries", eng: "Bhaiya, give me two packets of biscuit.", exp: "Yahan 'biscuit' common noun hai (koi bhi biscuit chalega). Agar bolte 'Parle-G', toh wo Proper noun hota." },
                { context: "Planning a trip", eng: "We are going to a city next month.", exp: "'city' aur 'month' dono common nouns hain. Exactly kahan aur kab? Nahi pata. Agar 'Mumbai' aur 'January' bolte, toh wo proper nouns hote." },
                { context: "Talking about cars", eng: "I bought a Tata Nexon yesterday.", exp: "'Tata Nexon' ek proper noun hai kyunki ye ek khaas car ka brand aur model hai. Isliye 'T' aur 'N' capital hain." },
                { context: "School admissions", eng: "My kid goes to a good school.", exp: "'school' aam naam (common) hai. Agar naam lete jaise 'St. Marys School', toh proper noun ban jata." },
                { context: "Describing a friend", eng: "My friend Amit is very helpful.", exp: "'friend' common noun hai (koi bhi dost ho sakta hai), lekin 'Amit' proper noun hai (ek specific dost ka naam)." }
            ];
            realLifeScenarios.push(...base);

            let counter = base.length;
            while(counter < 50) {
                let pair = concepts[counter % concepts.length];
                let isSpecific = Math.random() > 0.5;
                
                realLifeScenarios.push({
                    context: `Everyday Conversation ${counter}`,
                    eng: isSpecific ? `I really love ${pair.p}.` : `I want to buy a new ${pair.c}.`,
                    exp: isSpecific ? `Yahan '${pair.p}' ek proper noun hai kyunki ye ek dam specific cheez/insaan/jagah ka naam hai.` : `Yahan '${pair.c}' ek common noun hai kyunki ye ek general category hai.`
                });
                counter++;
            }
        };

        // 3. Generate exactly 100 Anki Cards (Strict format)
        const generateAnkiCSV = () => {
            let csv = "";
            let ankiData = [
                ["What type of noun is the word boy","Common Noun"],
                ["What type of noun is Rahul","Proper Noun"],
                ["Should the word city be capitalized in the middle of a sentence","No"],
                ["Should Mumbai be capitalized in the middle of a sentence","Yes"],
                ["What is the general name given to a person place or thing","Common Noun"],
                ["What is the specific name given to a person place or thing","Proper Noun"]
            ];
            
            let count = ankiData.length;
            while(count < 100) {
                let pair = concepts[count % concepts.length];
                if(count % 2 === 0) {
                    ankiData.push([`Is the word ${pair.c} a common noun or proper noun`,`Common Noun`]);
                } else {
                    ankiData.push([`Does the word ${pair.p} always start with a capital letter`,`Yes`]);
                }
                count++;
            }

            ankiData.forEach(pair => {
                // EXTREMELY STRICT FORMATTING: Remove all colons, semicolons, extra commas, bullet numbering
                let q = pair[0].replace(/[,:;]/g, '').replace(/^[0-9]+\.\s*/, '').trim();
                let a = pair[1].replace(/[,:;]/g, '').trim();
                csv += `${q},${a}\n`;
            });
            return csv;
        };

        // Init Data
        generateQuizData();
        generateRealLifeData();

        // --- STATE MANAGEMENT ---
        let state = {
            currentPage: 'home',
            history: [],
            timerSeconds: 0,
            timerInterval: null,
            quiz: {
                active: false,
                questions: [],
                currentIndex: 0,
                score: 0,
                answers: [],
                startTime: 0
            },
            realLifeIndex: 0
        };

        // --- UTILS ---
        const shuffleArray = (array) => {
            let curId = array.length;
            while (0 !== curId) {
                let randId = Math.floor(Math.random() * curId);
                curId -= 1;
                let tmp = array[curId];
                array[curId] = array[randId];
                array[randId] = tmp;
            }
            return array;
        };

        const formatTime = (totalSeconds) => {
            const m = Math.floor(totalSeconds / 60).toString().padStart(2, '0');
            const s = (totalSeconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        };

        // --- CORE LOGIC ---
        const startGlobalTimer = () => {
            state.timerInterval = setInterval(() => {
                state.timerSeconds++;
                const timerEl = document.getElementById('global-timer');
                if(timerEl) timerEl.innerText = formatTime(state.timerSeconds);
            }, 1000);
        };

        const navigate = (page) => {
            if(page === 'back') {
                if(state.history.length > 0) page = state.history.pop();
                else page = 'home';
            } else if (page !== 'home') {
                if(state.currentPage !== 'home') state.history.push(state.currentPage);
            } else {
                state.history = [];
            }
            state.currentPage = page;
            render();
        };

        const downloadAnki = () => {
            const csvData = generateAnkiCSV();
            const blob = new Blob([csvData], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('href', url);
            a.setAttribute('download', 'Proper_vs_Common_Nouns.csv');
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        };

        // --- QUIZ LOGIC ---
        const startQuiz = () => {
            let shuffled = shuffleArray([...quizBank]);
            state.quiz = {
                active: true,
                questions: shuffled.slice(0, 10),
                currentIndex: 0,
                score: 0,
                answers: [],
                startTime: state.timerSeconds
            };
            navigate('quiz_active');
        };

        const submitQuizAnswer = (selectedIndex) => {
            const currentQ = state.quiz.questions[state.quiz.currentIndex];
            const isCorrect = selectedIndex === currentQ.correct;
            
            if(isCorrect) state.quiz.score++;
            state.quiz.answers.push({ q: currentQ, selected: selectedIndex, isCorrect });

            document.getElementById('quiz-options').style.pointerEvents = 'none';
            
            const btns = document.querySelectorAll('.quiz-opt-btn');
            btns.forEach((btn, idx) => {
                if(idx === currentQ.correct) {
                    btn.classList.add('bg-green-600/40', 'border-green-500', 'text-white');
                    btn.classList.remove('bg-white/5', 'text-gray-300');
                } else if (idx === selectedIndex && !isCorrect) {
                    btn.classList.add('bg-red-600/40', 'border-red-500', 'text-white');
                    btn.classList.remove('bg-white/5', 'text-gray-300');
                }
            });

            document.getElementById('quiz-explanation').classList.remove('hidden');
            document.getElementById('quiz-next-btn').classList.remove('hidden');
        };

        const nextQuizQuestion = () => {
            state.quiz.currentIndex++;
            if(state.quiz.currentIndex >= 10) {
                navigate('quiz_results');
            } else {
                render(); // FIX applied here!
            }
        };

        // --- RENDERERS ---
        const render = () => {
            const main = document.getElementById('main-content');
            main.innerHTML = ''; 

            switch(state.currentPage) {
                case 'home': main.innerHTML = getHomeHTML(); break;
                case 'notes': main.innerHTML = getNotesHTML(); break;
                case 'story': main.innerHTML = getStoryHTML(); break;
                case 'quiz_intro': main.innerHTML = getQuizIntroHTML(); break;
                case 'quiz_active': main.innerHTML = getQuizActiveHTML(); break;
                case 'quiz_results': main.innerHTML = getQuizResultsHTML(); break;
                case 'reallife': main.innerHTML = getRealLifeHTML(); break;
            }
            lucide.createIcons();
            window.scrollTo(0, 0);
        };

        const getHomeHTML = () => `
            <div class="flex flex-col items-center justify-center space-y-6 mt-6 sm:mt-12 animate-fade-in">
                <div class="text-center mb-6 sm:mb-8">
                    <h1 class="text-2xl sm:text-3xl font-bold text-white mb-2 tracking-tight">Proper vs Common Nouns</h1>
                    <p class="text-gray-400 text-sm sm:text-base">Mastering the foundation of naming words.</p>
                </div>
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 w-full max-w-2xl px-2">
                    <button onclick="navigate('notes')" class="bg-[#111A2C] border-t border-white/5 shadow-xl rounded-2xl p-6 flex flex-col items-center hover:bg-[#16223A] transition group">
                        <i data-lucide="book-open" class="w-8 h-8 text-blue-500 mb-3 group-hover:scale-110 transition-transform"></i>
                        <h2 class="text-lg font-semibold text-white">Revise Notes</h2>
                        <p class="text-xs text-gray-400 text-center mt-2 leading-relaxed">Hinglish explanations, mind-maps & rules.</p>
                    </button>
                    
                    <button onclick="navigate('reallife')" class="bg-[#111A2C] border-t border-white/5 shadow-xl rounded-2xl p-6 flex flex-col items-center hover:bg-[#16223A] transition group">
                        <i data-lucide="users" class="w-8 h-8 text-green-500 mb-3 group-hover:scale-110 transition-transform"></i>
                        <h2 class="text-lg font-semibold text-white">Real Life Usage</h2>
                        <p class="text-xs text-gray-400 text-center mt-2 leading-relaxed">50 everyday Indian contexts.</p>
                    </button>

                    <button onclick="navigate('story')" class="bg-[#111A2C] border-t border-white/5 shadow-xl rounded-2xl p-6 flex flex-col items-center hover:bg-[#16223A] transition group">
                        <i data-lucide="book-text" class="w-8 h-8 text-purple-500 mb-3 group-hover:scale-110 transition-transform"></i>
                        <h2 class="text-lg font-semibold text-white">Read Story</h2>
                        <p class="text-xs text-gray-400 text-center mt-2 leading-relaxed">Learn contextually via a simple story.</p>
                    </button>

                    <button onclick="navigate('quiz_intro')" class="bg-[#111A2C] border-t border-white/5 shadow-xl rounded-2xl p-6 flex flex-col items-center hover:bg-[#16223A] transition group relative overflow-hidden">
                        <div class="absolute inset-0 bg-blue-500/5 opacity-0 group-hover:opacity-100 transition"></div>
                        <i data-lucide="brain-circuit" class="w-8 h-8 text-orange-500 mb-3 group-hover:scale-110 transition-transform relative z-10"></i>
                        <h2 class="text-lg font-semibold text-white relative z-10">Take Quiz</h2>
                        <p class="text-xs text-gray-400 text-center mt-2 leading-relaxed relative z-10">10 random questions from 100 bank.</p>
                    </button>
                </div>

                <div class="mt-8">
                    <button onclick="downloadAnki()" class="flex items-center space-x-2 text-gray-400 hover:text-white transition text-xs font-medium px-4 py-2 rounded-lg hover:bg-white/5">
                        <i data-lucide="download" class="w-4 h-4"></i>
                        <span>Download Anki Deck (100 Cards)</span>
                    </button>
                </div>
            </div>
        `;

        const getNotesHTML = () => `
            <div class="bg-[#111A2C] border-t border-white/5 shadow-2xl rounded-3xl p-6 sm:p-8 relative print-bg-white print-text-black print-border animate-fade-in">
                <div class="flex justify-between items-start mb-6 no-print">
                    <h1 class="text-2xl font-bold text-white">Revise: Proper vs Common Nouns</h1>
                    <div class="flex space-x-2">
                        <button onclick="window.print()" class="p-2 bg-[#080D1A] rounded-xl hover:bg-white/10 text-gray-400 transition" title="Print Notes">
                            <i data-lucide="printer" class="w-5 h-5"></i>
                        </button>
                        <button onclick="navigate('quiz_intro')" class="px-4 py-2 bg-[#2563EB] rounded-xl text-white text-sm font-semibold hover:bg-blue-600 transition shadow-lg shadow-blue-500/20">
                            Jump to Quiz
                        </button>
                    </div>
                </div>

                <div class="bg-[#080D1A] rounded-2xl p-5 mb-8 border border-white/5 no-print">
                    <h3 class="text-gray-400 text-xs font-bold mb-3 uppercase tracking-widest">Table of Contents</h3>
                    <ul class="text-sm space-y-3 text-blue-400 font-medium">
                        <li><a href="#intro" class="hover:text-blue-300 flex items-center"><i data-lucide="chevron-right" class="w-4 h-4 mr-1"></i> 1. Introduction & Prerequisites</a></li>
                        <li><a href="#common" class="hover:text-blue-300 flex items-center"><i data-lucide="chevron-right" class="w-4 h-4 mr-1"></i> 2. Common Noun (Aam Naam)</a></li>
                        <li><a href="#proper" class="hover:text-blue-300 flex items-center"><i data-lucide="chevron-right" class="w-4 h-4 mr-1"></i> 3. Proper Noun (Khaas Naam)</a></li>
                        <li><a href="#mistakes" class="hover:text-blue-300 flex items-center text-red-400"><i data-lucide="chevron-right" class="w-4 h-4 mr-1"></i> 4. Top Mistakes</a></li>
                    </ul>
                </div>

                <div class="space-y-10 text-gray-300 text-sm sm:text-base print-text-black leading-relaxed">
                    
                    <section id="intro">
                        <h2 class="text-lg font-bold text-white print-text-black mb-3">1. Introduction & Prerequisites</h2>
                        <p class="mb-4">Duniya mein har cheez ka koi na koi naam hota hai. Grammar ki duniya mein in naamon ko hi 'Noun' kehte hain. Ab ye naam do tarah ke hote hain: General (Aam) aur Specific (Khaas).</p>
                        
                        <div class="bg-white/5 border border-l-4 border-blue-500 p-4 rounded-r-xl">
                            <strong class="text-white text-sm block mb-2 uppercase tracking-wide">Prerequisites (Pehle ye samjhein):</strong>
                            <ul class="list-disc pl-5 space-y-2 text-sm">
                                <li><a href="https://www.google.com/search?q=What+is+a+Noun+in+English+Grammar" target="_blank" class="text-blue-400 hover:underline inline-flex items-center">What is a Noun? <i data-lucide="external-link" class="w-3 h-3 ml-1"></i></a> - Naming word (kisi insaan, jagah, ya cheez ka naam).</li>
                                <li><a href="https://www.google.com/search?q=Capitalization+rules+in+English" target="_blank" class="text-blue-400 hover:underline inline-flex items-center">Capital Letters <i data-lucide="external-link" class="w-3 h-3 ml-1"></i></a> - A, B, C (Bade akshar).</li>
                            </ul>
                        </div>
                    </section>

                    <section id="common">
                        <h2 class="text-lg font-bold text-white print-text-black mb-3">2. Common Noun (Aam Naam)</h2>
                        <p><strong>Use Case:</strong> Jab hum kisi category ya aam cheez ki baat karte hain, jiska koi specific naam humne nahi liya. Jaise 'ladka' (boy) – koi bhi ladka ho sakta hai.</p>
                        
                        <div class="mt-4 p-5 bg-[#080D1A] rounded-2xl border border-white/5">
                            <h4 class="text-white font-semibold text-sm mb-3">Mind Map / Hierarchy:</h4>
                            <ul class="list-[square] pl-5 space-y-2 text-gray-400 text-sm">
                                <li><strong>People:</strong> boy, girl, doctor, teacher, uncle</li>
                                <li><strong>Places:</strong> city, state, country, hospital, park</li>
                                <li><strong>Things:</strong> car, biscuit, phone, book, dog</li>
                            </ul>
                        </div>
                        
                        <div class="mt-4 border-l-2 border-gray-600 pl-4 text-sm italic">
                            <strong class="text-white not-italic">Rule:</strong> Inko Capital letter se shuru NAHI karte, jab tak ye sentence ka pehla word na ho.
                        </div>
                    </section>

                    <section id="proper">
                        <h2 class="text-lg font-bold text-white print-text-black mb-3">3. Proper Noun (Khaas Naam)</h2>
                        <p><strong>Use Case:</strong> Jab hum us 'aam cheez' ko ek proper tag ya identity de dete hain. Jaise 'ladka' ban gaya 'Rahul', 'city' ban gayi 'Delhi'.</p>
                        
                        <div class="mt-4 p-5 bg-[#080D1A] rounded-2xl border border-white/5">
                            <h4 class="text-white font-semibold text-sm mb-3">Mind Map / Hierarchy:</h4>
                            <ul class="list-[square] pl-5 space-y-2 text-gray-400 text-sm">
                                <li><strong>People:</strong> Rahul, Priya, Dr. Sharma, Mr. Gupta</li>
                                <li><strong>Places:</strong> Delhi, Maharashtra, India, Apollo Hospital</li>
                                <li><strong>Things/Brands:</strong> Tata Nexon, Parle-G, iPhone, Harry Potter, Tommy (dog's name)</li>
                            </ul>
                        </div>

                        <div class="mt-4 border-l-2 border-blue-500 pl-4 text-sm italic">
                            <strong class="text-white not-italic">Rule:</strong> Proper Nouns ka pehla letter HAMESHA Capital hoga, chahe wo sentence ke beech mein hi kyun na aaye.
                        </div>
                    </section>

                    <section id="mistakes" class="border-t border-red-500/20 pt-8">
