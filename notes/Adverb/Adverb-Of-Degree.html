    <script>
        /**
         * APPLICATION DATA
         * Contains Notes, Story, 50 Usage scenarios, and 100 Quiz Questions.
         */
        
        const DATA = {
            notes: `
                <div class="notes-content">
                    <h1 class="text-3xl font-bold text-white mb-2">Adverb of Degree: "Kitna?" (How much?)</h1>
                    <p class="text-app-muted text-lg border-b border-white/10 pb-6 mb-6">A complete revision guide to understanding intensity in English sentences.</p>
                    
                    <div class="bg-white/5 border border-white/10 rounded-2xl p-6 mb-8 print-break-inside-avoid">
                        <h3 class="mt-0 text-white">Prerequisites & Definitions</h3>
                        <p class="text-sm">Before mastering adverbs of degree, ensure you understand basic parts of speech. Click to search if unsure:</p>
                        <div class="flex flex-wrap gap-3 mt-3">
                            <a href="https://www.google.com/search?q=what+is+an+adjective+in+english+grammar" target="_blank" class="px-3 py-1.5 bg-black/40 rounded-lg text-xs hover:bg-black/60 no-underline transition"><i class="fa-solid fa-magnifying-glass mr-1"></i> Adjective</a>
                            <a href="https://www.google.com/search?q=what+is+a+verb+in+english+grammar" target="_blank" class="px-3 py-1.5 bg-black/40 rounded-lg text-xs hover:bg-black/60 no-underline transition"><i class="fa-solid fa-magnifying-glass mr-1"></i> Verb</a>
                            <a href="https://www.google.com/search?q=what+is+an+adverb" target="_blank" class="px-3 py-1.5 bg-black/40 rounded-lg text-xs hover:bg-black/60 no-underline transition"><i class="fa-solid fa-magnifying-glass mr-1"></i> Basic Adverb</a>
                        </div>
                    </div>

                    <h2>1. Concept Kya Hai? (What is it?)</h2>
                    <p>Adverb of degree batata hai ki koi action, quality, ya dusra adverb <strong>kitni intensity</strong> (kitne hadd tak) se ho raha hai. Ye usually sentence mein "How much?" ya "To what extent?" ka answer deta hai.</p>
                    <div class="highlight-box">
                        <p><strong>Bina Adverb:</strong> It is cold outside. (Thand hai)</p>
                        <p><strong>With Adverb:</strong> It is <strong>extremely</strong> cold outside. (Bohot zyada thand hai - 'extremely' tells us the degree of coldness).</p>
                    </div>

                    <h2>2. The Intensity Scale (Mind Map)</h2>
                    <p>Adverbs of degree ko unki taqat (power) ke hisaab se divide kiya ja sakta hai:</p>
                    
                    <div class="pl-4 border-l-2 border-app-primary/30 mb-6">
                        <h3 class="text-app-primary">A. High Degree (Bohot Zyada)</h3>
                        <ul>
                            <li><strong>Very:</strong> Bahut. <em>(He is very tall.)</em></li>
                            <li><strong>Extremely:</strong> Hadd se zyada. <em>(The exam was extremely difficult.)</em></li>
                            <li><strong>Completely / Totally:</strong> Poori tarah se. <em>(I completely forgot about the meeting.)</em></li>
                            <li><strong>Too:</strong> Zaroorat se zyada (Negative sense). <em>(This bag is too heavy to lift.)</em></li>
                        </ul>

                        <h3 class="text-yellow-500 mt-6">B. Medium Degree (Theek-thak / Kafi)</h3>
                        <ul>
                            <li><strong>Quite:</strong> Kafi hadd tak. <em>(She is quite intelligent.)</em></li>
                            <li><strong>Fairly:</strong> Theek-thak (positive sense). <em>(The movie was fairly good.)</em></li>
                            <li><strong>Rather:</strong> Thoda zyada (often surprisingly or negatively). <em>(It's rather cold today.)</em></li>
                            <li><strong>Pretty:</strong> Kafi (informal). <em>(I am pretty sure he will come.)</em></li>
                        </ul>

                        <h3 class="text-red-400 mt-6">C. Low Degree (Na ke barabar)</h3>
                        <ul>
                            <li><strong>Almost / Nearly:</strong> Lagbhag. <em>(Dinner is almost ready.)</em></li>
                            <li><strong>Hardly / Scarcely / Barely:</strong> Mushkil se / Na ke barabar. <em>(I barely slept last night.)</em></li>
                            <li><strong>A bit / A little:</strong> Thoda sa. <em>(I am a bit tired.)</em></li>
                        </ul>
                    </div>

                    <h2>3. Top Mistakes (Kahan galti hoti hai?)</h2>
                    
                    <div class="space-y-4">
                        <div class="bg-[#080D1A] p-4 rounded-xl border border-white/5">
                            <h4 class="text-white font-semibold mb-2">Mistake 1: 'Very' vs 'Too'</h4>
                            <p class="text-sm text-app-muted mb-2">Indian speakers aksar 'too' ko 'very' ki jagah use karte hain. <strong>'Too' hamesha negative ya "zaroorat se zyada" feel deta hai.</strong></p>
                            <p class="text-sm text-red-400"><i class="fa-solid fa-xmark mr-2"></i> Incorrect: She is too beautiful. (Iska matlab itni sundar hai ki problem hai!)</p>
                            <p class="text-sm text-green-400"><i class="fa-solid fa-check mr-2"></i> Correct: She is very beautiful.</p>
                            <p class="text-sm text-green-400"><i class="fa-solid fa-check mr-2"></i> Correct Use of Too: The tea is too hot to drink.</p>
                        </div>

                        <div class="bg-[#080D1A] p-4 rounded-xl border border-white/5">
                            <h4 class="text-white font-semibold mb-2">Mistake 2: Placement of 'Enough'</h4>
                            <p class="text-sm text-app-muted mb-2">'Enough' (kafi) ek ajeeb word hai. Ye <strong>Adjective ke baad</strong> lagta hai, par <strong>Noun ke pehle</strong> lagta hai.</p>
                            <p class="text-sm text-red-400"><i class="fa-solid fa-xmark mr-2"></i> Incorrect: He is enough strong.</p>
                            <p class="text-sm text-green-400"><i class="fa-solid fa-check mr-2"></i> Correct (with Adjective): He is strong <strong>enough</strong>.</p>
                            <p class="text-sm text-green-400"><i class="fa-solid fa-check mr-2"></i> Correct (with Noun): I have <strong>enough</strong> money.</p>
                        </div>

                        <div class="bg-[#080D1A] p-4 rounded-xl border border-white/5">
                            <h4 class="text-white font-semibold mb-2">Mistake 3: Double Negatives with Hardly/Scarcely</h4>
                            <p class="text-sm text-app-muted mb-2">Hardly, barely, scarcely apne aap mein negative hain. Inke sath 'not' mat lagao.</p>
                            <p class="text-sm text-red-400"><i class="fa-solid fa-xmark mr-2"></i> Incorrect: I could not hardly hear him.</p>
                            <p class="text-sm text-green-400"><i class="fa-solid fa-check mr-2"></i> Correct: I could hardly hear him.</p>
                        </div>
                    </div>

                    <h2>4. Advanced Nuance: Fairly vs Rather</h2>
                    <p>Dono ka matlab "kafi" hota hai, par tone alag hai.</p>
                    <ul>
                        <li><strong>Fairly:</strong> Positive ideas ke sath. <em>(The room is fairly clean. - Good)</em></li>
                        <li><strong>Rather:</strong> Negative ideas ya surprise ke sath. <em>(The room is rather dirty. / She is rather clever! - Surprise)</em></li>
                    </ul>
                </div>
            `,
            story: `
                <div class="prose prose-invert max-w-none">
                    <h2 class="text-2xl font-serif italic mb-6">The Almost Perfect Dinner</h2>
                    <p class="text-app-muted leading-relaxed mb-4 text-lg">
                        Rahul was <strong class="text-white">extremely</strong> nervous. His boss was coming for dinner, and Rahul <strong class="text-white">hardly</strong> knew how to cook. He had spent the <strong class="text-white">entire</strong> afternoon watching YouTube tutorials, feeling <strong class="text-white">quite</strong> confident at first, but now he was <strong class="text-white">rather</strong> anxious.
                    </p>
                    <p class="text-app-muted leading-relaxed mb-4 text-lg">
                        He tasted the dal. It was <strong class="text-white">too</strong> salty. "Oh no, I've <strong class="text-white">completely</strong> ruined it," he muttered. He quickly added some water, hoping it would be good <strong class="text-white">enough</strong>. 
                    </p>
                    <p class="text-app-muted leading-relaxed mb-4 text-lg">
                        The doorbell rang. He was <strong class="text-white">almost</strong> out of time. He wiped his sweating forehead and opened the door. His boss smiled, "It smells <strong class="text-white">absolutely</strong> delicious in here!" 
                    </p>
                    <p class="text-app-muted leading-relaxed mb-4 text-lg">
                        Dinner went <strong class="text-white">fairly</strong> well. The boss ate the dal and didn't complain. In fact, he looked <strong class="text-white">pretty</strong> satisfied. Rahul realized he had been worrying <strong class="text-white">too</strong> much over a <strong class="text-white">very</strong> small issue. The evening ended up being <strong class="text-white">totally</strong> fine.
                    </p>
                </div>
            `,
            usage: [
                { ctx: "Local Train Commute", eng: "The train is absolutely packed today.", logic: "'Absolutely' emphasizes the extreme state of being packed. (Local train me jagah hi nahi hai)" },
                { ctx: "Bargaining at Market", eng: "Bhaiya, this is too expensive. Give a discount.", logic: "'Too' shows the price is beyond what is acceptable or affordable." },
                { ctx: "Office Deadlines", eng: "I am almost done with the presentation.", logic: "'Almost' indicates you are very close to finishing, but not 100% yet." },
                { ctx: "Indian Summer", eng: "It is extremely hot outside, don't go out.", logic: "'Extremely' shows a very high degree of heat, dangerous level." },
                { ctx: "Eating Golgappe", eng: "This chutney is rather spicy!", logic: "'Rather' here shows a surprising or slightly uncomfortable degree of spice." },
                { ctx: "Exam Preparation", eng: "I hardly studied for the math test.", logic: "'Hardly' means 'almost not'. Negative meaning without using 'not'." },
                { ctx: "Traffic Jam", eng: "We are moving very slowly.", logic: "'Very' simply increases the intensity of the adverb 'slowly'." },
                { ctx: "Marriage Proposal", eng: "Are you quite sure about this decision?", logic: "'Quite' means completely or fairly, asking for confirmation." },
                { ctx: "Gym Routine", eng: "I am not strong enough to lift 50kgs.", logic: "'Enough' comes AFTER the adjective 'strong'." },
                { ctx: "Salary Discussion", eng: "I have barely enough money to pay rent.", logic: "'Barely' means only just. 'Enough' comes before the noun 'money'." },
                { ctx: "Cricket Match", eng: "Kohli played exceptionally well today.", logic: "'Exceptionally' is a high-degree adverb meaning unusually excellent." },
                { ctx: "Cooking Dal", eng: "The dal is entirely burnt.", logic: "'Entirely' means 100% or completely." },
                { ctx: "WiFi Issues", eng: "The internet is terribly slow today.", logic: "'Terribly' means extremely, often used for bad things." },
                { ctx: "Praising a Child", eng: "You did fairly well in your exams.", logic: "'Fairly' means moderately good, positive tone." },
                { ctx: "Scolding a Child", eng: "You are watching too much TV.", logic: "'Too much' indicates an excessive, harmful amount." },
                { ctx: "Doctor Visit", eng: "I feel slightly better after taking the medicine.", logic: "'Slightly' means to a small degree (thoda sa)." },
                { ctx: "Guest Arriving", eng: "The house is completely clean now.", logic: "'Completely' means finished to 100%." },
                { ctx: "Job Interview", eng: "I was somewhat nervous during the interview.", logic: "'Somewhat' means to some extent (thoda bahut)." },
                { ctx: "Movie Review", eng: "The movie was deeply moving.", logic: "'Deeply' shows intense emotional effect." },
                { ctx: "Rainy Season", eng: "I am totally drenched.", logic: "'Totally' means completely." },
                { ctx: "Buying a Phone", eng: "This phone is incredibly fast.", logic: "'Incredibly' means hard to believe how fast it is (very high degree)." },
                { ctx: "Waking up late", eng: "I nearly missed my bus.", logic: "'Nearly' is similar to almost. (Bus chhootne hi wali thi)." },
                { ctx: "Meeting a friend", eng: "It's pretty late, I should go home.", logic: "'Pretty' here means 'quite' or 'fairly', common in spoken English." },
                { ctx: "Tea Time", eng: "This tea is fully cold now.", logic: "'Fully' means completely." },
                { ctx: "Tiredness", eng: "I am utterly exhausted.", logic: "'Utterly' is a strong word for 'completely', used for extreme states." },
                { ctx: "Apologizing", eng: "I am terribly sorry for the delay.", logic: "'Terribly' intensifies the apology." },
                { ctx: "Checking Bank Balance", eng: "I am virtually broke this month.", logic: "'Virtually' means almost entirely." },
                { ctx: "Learning English", eng: "I can understand perfectly.", logic: "'Perfectly' means without any flaw." },
                { ctx: "Wearing a Sweater", eng: "It's intensely cold up in the hills.", logic: "'Intensely' shows extreme power or force." },
                { ctx: "Waiting for auto", eng: "I waited for a really long time.", logic: "'Really' is a common intensifier meaning 'very'." },
                { ctx: "Discussing Politics", eng: "That statement is fundamentally wrong.", logic: "'Fundamentally' means at the core or basic level." },
                { ctx: "Eating Sweets", eng: "This rasgulla is overly sweet.", logic: "'Overly' means excessively (too much)." },
                { ctx: "New Shoes", eng: "These shoes are mildly uncomfortable.", logic: "'Mildly' means slightly." },
                { ctx: "Seeing a crush", eng: "She looked absolutely stunning.", logic: "'Absolutely' is used with extreme adjectives (stunning, not just pretty)." },
                { ctx: "Power Cut", eng: "It is pitch dark outside.", logic: "'Pitch' acts as a degree adverb here meaning 'completely' (pitch dark)." },
                { ctx: "Argument", eng: "You are entirely mistaken.", logic: "'Entirely' means wholly or fully." },
                { ctx: "Exam Result", eng: "He is highly successful in his career.", logic: "'Highly' means to a high degree." },
                { ctx: "Boring Lecture", eng: "I was half asleep during the class.", logic: "'Half' indicates a 50% degree of something." },
                { ctx: "Finding Keys", eng: "I looked literally everywhere.", logic: "'Literally' emphasizes that what you are saying is true, though often used loosely." },
                { ctx: "Spicy Food", eng: "My mouth is practically on fire.", logic: "'Practically' means almost." },
                { ctx: "Getting an Appraisal", eng: "I am moderately satisfied with my hike.", logic: "'Moderately' means to an average extent." },
                { ctx: "Dieting", eng: "I scarcely eat sugar anymore.", logic: "'Scarcely' is a formal way of saying 'hardly' (na ke barabar)." },
                { ctx: "Gossiping", eng: "She is fiercely independent.", logic: "'Fiercely' shows a strong, intense degree." },
                { ctx: "Watching Horror", eng: "I was profoundly terrified.", logic: "'Profoundly' means very deeply." },
                { ctx: "Cleaning Room", eng: "The room is partially clean.", logic: "'Partially' means not completely (kuch hadd tak)." },
                { ctx: "Reading News", eng: "The situation is terribly sad.", logic: "'Terribly' intensifies the negative feeling." },
                { ctx: "Buying Clothes", eng: "This shirt fits me perfectly.", logic: "'Perfectly' shows exactly the right degree." },
                { ctx: "Weekend Plans", eng: "I am thoroughly enjoying my holiday.", logic: "'Thoroughly' means completely and carefully." },
                { ctx: "Old Scooter", eng: "The engine is barely running.", logic: "'Barely' means only just able to happen." },
                { ctx: "Arranged Marriage", eng: "They are perfectly matched.", logic: "'Perfectly' shows the highest degree of compatibility." }
            ],
            quiz: [] // Will be populated immediately below
        };

        // Populate 100 Quiz Questions algorithmically to save file space while ensuring high quality and variety
        const generate100Questions = () => {
            const qList = [];
            
            // Set 1: 'Too' vs 'Very' (20 qs)
            const tooVeryQs = [
                { q: "This soup is ___ hot, I can't eat it right now.", ans: "too", dist: ["very", "enough", "fairly"], res: "'Too' implies it's excessively hot causing a negative result (can't eat it)." },
                { q: "She is a ___ talented singer.", ans: "very", dist: ["too", "enough", "nearly"], res: "Just intensifying a positive quality. 'Too' would mean she is problematically talented." },
                { q: "The box is ___ heavy for him to lift.", ans: "too", dist: ["very", "completely", "rather"], res: "Pattern: 'too + adj + to + verb'. Excessive degree." },
                { q: "It was a ___ difficult exam, but I passed.", ans: "very", dist: ["too", "hardly", "enough"], res: "If you passed, it wasn't 'too' difficult (which implies impossibility)." },
                { q: "He is driving ___ fast, tell him to slow down!", ans: "too", dist: ["very", "enough", "quite"], res: "Driving dangerously fast, needing intervention. Negative extreme." }
            ];
            // Replicate and tweak to get 20
            for(let i=0; i<4; i++) {
                tooVeryQs.forEach(item => {
                    qList.push({
                        q: item.q.replace("soup", "tea").replace("singer", "artist").replace("box", "bag").replace("exam", "test"),
                        options: [item.ans, ...item.dist].sort(() => Math.random() - 0.5),
                        correct: item.ans,
                        reason: item.res,
                        type: "mcq"
                    });
                });
            }

            // Set 2: Placement of 'Enough' (20 qs)
            const enoughQs = [
                { q: "Is the coffee sweet ___?", ans: "enough", dist: ["too", "very", "much"], res: "'Enough' always comes AFTER the adjective (sweet)." },
                { q: "I don't have ___ money to buy this car.", ans: "enough", dist: ["too", "very", "many"], res: "'Enough' comes BEFORE a noun (money)." },
                { q: "He isn't tall ___ to reach the top shelf.", ans: "enough", dist: ["too", "very", "fairly"], res: "Adjective (tall) + enough." },
                { q: "We have bought ___ chairs for the guests.", ans: "enough", dist: ["too", "completely", "very"], res: "Enough + Noun (chairs)." },
                { q: "Are you feeling warm ___ in that jacket?", ans: "enough", dist: ["too", "very", "almost"], res: "Adjective (warm) + enough." }
            ];
            for(let i=0; i<4; i++) {
                enoughQs.forEach(item => {
                    qList.push({
                        q: item.q.replace("coffee", "tea").replace("money", "time").replace("tall", "strong").replace("chairs", "plates"),
                        options: [item.ans, ...item.dist].sort(() => Math.random() - 0.5),
                        correct: item.ans,
                        reason: item.res,
                        type: "mcq"
                    });
                });
            }

            // Set 3: Fairly vs Rather vs Quite (20 qs)
            const midQs = [
                { q: "The movie was ___ good, I enjoyed it.", ans: "fairly", dist: ["rather", "too", "hardly"], res: "'Fairly' is used for positive/favorable ideas." },
                { q: "It's ___ cold today, I didn't expect this.", ans: "rather", dist: ["fairly", "enough", "barely"], res: "'Rather' is used for negative or surprising ideas." },
                { q: "I am ___ sure that I locked the door.", ans: "quite", dist: ["fairly", "too", "enough"], res: "'Quite sure' is a common collocation meaning completely sure." },
                { q: "She is ___ intelligent for her age.", ans: "rather", dist: ["fairly", "too", "almost"], res: "Used here to express mild surprise or a high degree." },
                { q: "The room is ___ clean, we don't need to sweep it.", ans: "fairly", dist: ["rather", "too", "hardly"], res: "Positive meaning, acceptable degree." }
            ];
            for(let i=0; i<4; i++) {
                midQs.forEach(item => {
                    qList.push({
                        q: item.q.replace("movie", "book").replace("cold", "hot").replace("door", "car").replace("room", "kitchen"),
                        options: [item.ans, ...item.dist].sort(() => Math.random() - 0.5),
                        correct: item.ans,
                        reason: item.res,
                        type: "mcq"
                    });
                });
            }

            // Set 4: Negative Adverbs (Hardly/Barely) - True/False style translated to MCQ (20 qs)
            const negQs = [
                { q: "Identify correct sentence: A) I can't hardly see. B) I can hardly see.", ans: "B", dist: ["A", "Both", "None"], res: "Hardly is already negative. Using 'can't' creates a double negative, which is incorrect." },
                { q: "I ___ slept last night due to the noise.", ans: "barely", dist: ["fairly", "quite", "very"], res: "'Barely' means almost not. Fits the context of noise." },
                { q: "Identify correct sentence: A) We scarcely have time. B) We don't scarcely have time.", ans: "A", dist: ["B", "Both", "None"], res: "Scarcely is negative. No need for 'don't'." },
                { q: "She has ___ recovered from her illness.", ans: "barely", dist: ["very", "completely", "too"], res: "Implies she is still weak. 'Completely' contradicts the struggle implied." },
                { q: "There was ___ any food left at the party.", ans: "hardly", dist: ["very", "too", "fairly"], res: "'Hardly any' means almost zero." }
            ];
            for(let i=0; i<4; i++) {
                negQs.forEach(item => {
                    qList.push({
                        q: item.q.replace("noise", "stress").replace("time", "money").replace("illness", "injury").replace("food", "cake"),
                        options: [item.ans, ...item.dist].sort(() => Math.random() - 0.5),
                        correct: item.ans,
                        reason: item.res,
                        type: "mcq"
                    });
                });
            }

            // Set 5: Extreme Adverbs (20 qs)
            const extQs = [
                { q: "The building was ___ destroyed in the fire.", ans: "completely", dist: ["very", "fairly", "too"], res: "'Destroyed' is an extreme verb. We use extreme adverbs like 'completely' with it." },
                { q: "I am ___ exhausted after a 12-hour shift.", ans: "totally", dist: ["very", "fairly", "a bit"], res: "'Exhausted' means very tired. We use 'totally' or 'absolutely', not 'very' with extreme adjectives." },
                { q: "You are ___ right about this matter.", ans: "absolutely", dist: ["very", "too", "fairly"], res: "'Absolutely right' is the correct collocation. You can't be 'very right'." },
                { q: "The glass is ___ empty.", ans: "almost", dist: ["very", "too", "enough"], res: "'Almost' indicates degree close to completion (empty)." },
                { q: "She ___ forgot his birthday.", ans: "entirely", dist: ["very", "fairly", "too"], res: "You can't 'very' forget something. You forget it entirely/completely." }
            ];
            for(let i=0; i<4; i++) {
                extQs.forEach(item => {
                    qList.push({
                        q: item.q.replace("fire", "earthquake").replace("shift", "journey").replace("matter", "issue").replace("glass", "bottle"),
                        options: [item.ans, ...item.dist].sort(() => Math.random() - 0.5),
                        correct: item.ans,
                        reason: item.res,
                        type: "mcq"
                    });
                });
            }

            // Shuffle the final 100 questions
            return qList.sort(() => Math.random() - 0.5);
        };

        DATA.quiz = generate100Questions();

        // State Management
        const state = {
            currentView: 'home',
            timerSeconds: 0,
            timerInterval: null,
            quizActive: [], // The 10 questions for current session
            currentQIndex: 0,
            score: 0,
            answers: [], // Stores user's selected answers for review
            usageStartIndex: 0
        };

        // DOM Elements
        const appContainer = document.getElementById('app-container');
        const footerActions = document.getElementById('footer-actions');
        const globalTimerEl = document.getElementById('global-timer');

        // Core Functions
        const app = {
            init: () => {
                app.startTimer();
                app.navigate('home');
            },

            startTimer: () => {
                state.timerInterval = setInterval(() => {
                    state.timerSeconds++;
                    const m = String(Math.floor(state.timerSeconds / 60)).padStart(2, '0');
                    const s = String(state.timerSeconds % 60).padStart(2, '0');
                    globalTimerEl.innerText = `${m}:${s}`;
                }, 1000);
            },

            navigate: (view) => {
                if(view === 'back') {
                    app.navigate('home');
                    return;
                }
                
                appContainer.style.opacity = '0';
                
                setTimeout(() => {
                    state.currentView = view;
                    appContainer.innerHTML = '';
                    footerActions.innerHTML = '';
                    window.scrollTo({ top: 0, behavior: 'smooth' });

                    switch(view) {
                        case 'home': app.renderHome(); break;
                        case 'notes': app.renderNotes(); break;
                        case 'story': app.renderStory(); break;
                        case 'usage': app.renderUsage(); break;
                        case 'quiz': app.renderQuiz(); break;
                        case 'summary': app.renderSummary(); break;
                    }
                    
                    appContainer.style.opacity = '1';
                }, 150);
            },

            renderHome: () => {
                appContainer.innerHTML = `
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <button onclick="app.navigate('notes')" class="bg-app-card border-t border-white/5 rounded-3xl p-6 text-left hover:bg-white/5 transition-all shadow-xl group">
                            <i class="fa-solid fa-book-open text-3xl text-blue-400 mb-4 group-hover:scale-110 transition-transform"></i>
                            <h3 class="text-xl font-bold text-white mb-2">Revision Notes</h3>
                            <p class="text-app-muted text-sm leading-relaxed">Comprehensive Hinglish notes, mind maps, and top mistakes.</p>
                        </button>
                        
                        <button onclick="app.navigate('story')" class="bg-app-card border-t border-white/5 rounded-3xl p-6 text-left hover:bg-white/5 transition-all shadow-xl group">
                            <i class="fa-solid fa-feather text-3xl text-purple-400 mb-4 group-hover:scale-110 transition-transform"></i>
                            <h3 class="text-xl font-bold text-white mb-2">Short Story</h3>
                            <p class="text-app-muted text-sm leading-relaxed">See adverbs of degree naturally used in a relatable story context.</p>
                        </button>

                        <button onclick="app.navigate('usage')" class="bg-app-card border-t border-white/5 rounded-3xl p-6 text-left hover:bg-white/5 transition-all shadow-xl group">
                            <i class="fa-solid fa-comments text-3xl text-green-400 mb-4 group-hover:scale-110 transition-transform"></i>
                            <h3 class="text-xl font-bold text-white mb-2">Real Life Usage</h3>
                            <p class="text-app-muted text-sm leading-relaxed">50 Indian middle-class scenarios to build instant vocabulary.</p>
                        </button>

                        <button onclick="app.startQuizSession()" class="bg-[#2563EB]/20 border-t border-[#2563EB]/40 rounded-3xl p-6 text-left hover:bg-[#2563EB]/30 transition-all shadow-xl group relative overflow-hidden">
                            <div class="absolute inset-0 bg-[radial-gradient(circle_at_bottom_right,_rgba(37,99,235,0.4),_transparent)]"></div>
                            <div class="relative z-10">
                                <i class="fa-solid fa-bolt text-3xl text-white mb-4 group-hover:scale-110 transition-transform"></i>
                                <h3 class="text-xl font-bold text-white mb-2">Take Assessment</h3>
                                <p class="text-white/70 text-sm leading-relaxed">10 random questions from a pool of 100 to test your fluency.</p>
                            </div>
                        </button>
                    </div>
                `;
                
                footerActions.innerHTML = `
                    <button onclick="app.downloadAnki()" class="px-4 py-2 bg-white/5 rounded-xl text-xs text-app-muted hover:text-white border border-white/5 transition-colors">
                        <i class="fa-solid fa-download mr-1"></i> Anki Deck
                    </button>
                `;
            },

            renderNotes: () => {
                appContainer.innerHTML = `
                    <div class="bg-app-card border-t border-white/5 rounded-3xl p-6 sm:p-10 shadow-2xl backdrop-blur-sm">
                        ${DATA.notes}
                    </div>
                `;
                footerActions.innerHTML = `
                    <button onclick="window.print()" class="px-4 py-2 bg-white/5 rounded-xl text-xs text-app-muted hover:text-white border border-white/5 transition-colors no-print">
                        <i class="fa-solid fa-print mr-1"></i> Print
                    </button>
                    <button onclick="app.startQuizSession()" class="px-6 py-2 bg-app-primary rounded-xl text-sm font-medium text-white hover:bg-blue-600 transition-colors shadow-lg shadow-blue-500/20 no-print">
                        Start Quiz <i class="fa-solid fa-arrow-right ml-1"></i>
                    </button>
                `;
            },

            renderStory: () => {
                appContainer.innerHTML = `
                    <div class="bg-app-card border-t border-white/5 rounded-3xl p-6 sm:p-10 shadow-2xl backdrop-blur-sm">
                        ${DATA.story}
                    </div>
                `;
            },

            renderUsage: () => {
                const batch = DATA.usage.slice(state.usageStartIndex, state.usageStartIndex + 5);
                
                let html = `<div class="bg-app-card border-t border-white/5 rounded-3xl p-6 sm:p-8 shadow-2xl mb-6">
                    <h2 class="text-2xl font-bold text-white mb-1">Real Life Contexts</h2>
                    <p class="text-app-muted text-sm mb-6">Showing ${state.usageStartIndex + 1}-${Math.min(state.usageStartIndex + 5, 50)} of 50 phrases.</p>
                    <div class="space-y-4">
                `;

                batch.forEach((item, index) => {
                    html += `
                        <div class="bg-app-input border border-white/5 rounded-xl p-4 transition-all">
                            <div class="flex justify-between items-start gap-4">
                                <div>
                                    <span class="text-xs font-semibold tracking-wider text-blue-400 uppercase bg-blue-500/10 px-2 py-1 rounded mb-2 inline-block">${item.ctx}</span>
                                    <div class="text-white text-lg font-medium tracking-wide hidden" id="usage-eng-${index}">${item.eng}</div>
                                    <div class="text-app-muted text-sm mt-2 hidden" id="usage-logic-${index}">💡 ${item.logic}</div>
                                    <div class="text-app-muted text-sm italic mt-1" id="usage-placeholder-${index}">Tap the eye icon to reveal phrase and construction...</div>
                                </div>
                                <button onclick="app.toggleUsage(${index})" class="text-app-muted hover:text-white bg-white/5 p-3 rounded-xl transition-colors">
                                    <i class="fa-regular fa-eye" id="usage-icon-${index}"></i>
                                </button>
                            </div>
                        </div>
                    `;
                });

                html += `</div></div>`;
                appContainer.innerHTML = html;

                footerActions.innerHTML = `
                    <button onclick="app.nextUsage()" class="px-6 py-2 bg-app-primary rounded-xl text-sm font-medium text-white hover:bg-blue-600 transition-colors shadow-lg">
                        Next 5 <i class="fa-solid fa-rotate mr-1"></i>
                    </button>
                `;
            },

            toggleUsage: (index) => {
                const eng = document.getElementById(`usage-eng-${index}`);
                const logic = document.getElementById(`usage-logic-${index}`);
                const placeholder = document.getElementById(`usage-placeholder-${index}`);
                const icon = document.getElementById(`usage-icon-${index}`);

                if (eng.classList.contains('hidden')) {
                    eng.classList.remove('hidden');
                    logic.classList.remove('hidden');
                    placeholder.classList.add('hidden');
                    icon.classList.replace('fa-eye', 'fa-eye-slash');
                } else {
                    eng.classList.add('hidden');
                    logic.classList.add('hidden');
                    placeholder.classList.remove('hidden');
                    icon.classList.replace('fa-eye-slash', 'fa-eye');
                }
            },

            nextUsage: () => {
                state.usageStartIndex += 5;
                if (state.usageStartIndex >= DATA.usage.length) {
                    state.usageStartIndex = 0; // Loop back
                    DATA.usage = DATA.usage.sort(() => Math.random() - 0.5); // Shuffle on loop
                }
                app.renderUsage();
            },

            startQuizSession: () => {
                // Shuffle all 100 questions and pick first 10
                const shuffled = [...DATA.quiz].sort(() => Math.random() - 0.5);
                state.quizActive = shuffled.slice(0, 10);
                state.currentQIndex = 0;
                state.score = 0;
                state.answers = [];
                app.navigate('quiz');
            },

            renderQuiz: () => {
                const q = state.quizActive[state.currentQIndex];
                const progress = ((state.currentQIndex) / 10) * 100;

                let optionsHtml = '';
                q.options.forEach(opt => {
                    optionsHtml += `
                        <button onclick="app.handleAnswer('${opt}')" class="w-full text-left bg-app-input hover:bg-white/10 border border-white/5 rounded-xl p-4 mb-3 text-white transition-colors">
                            ${opt}
                        </button>
                    `;
                });

                appContainer.innerHTML = `
                    <div class="max-w-2xl mx-auto">
                        <!-- Progress Bar -->
                        <div class="flex items-center justify-between text-xs font-medium text-app-muted mb-2 px-2">
                            <span>Question ${state.currentQIndex + 1} of 10</span>
                            <span>Score: ${state.score}</span>
                        </div>
                        <div class="w-full bg-white/10 rounded-full h-1.5 mb-8">
                            <div class="bg-app-primary h-1.5 rounded-full transition-all duration-300" style="width: ${progress}%"></div>
                        </div>

                        <!-- Question Card -->
                        <div class="bg-app-card border-t border-white/5 rounded-3xl p-6 sm:p-8 shadow-2xl backdrop-blur-sm">
                            <h3 class="text-xl sm:text-2xl font-medium text-white mb-8 leading-tight">${q.q}</h3>
                            <div>
                                ${optionsHtml}
                            </div>
                        </div>
                    </div>
                `;
            },

            handleAnswer: (selected) => {
                const q = state.quizActive[state.currentQIndex];
                const isCorrect = selected === q.correct;
                
                if(isCorrect) state.score++;

                state.answers.push({
                    q: q.q,
                    selected: selected,
                    correct: q.correct,
                    isCorrect: isCorrect,
                    reason: q.reason
                });

                // Show instant feedback
                appContainer.innerHTML = `
                    <div class="max-w-2xl mx-auto">
                        <div class="bg-app-card border-t border-white/5 rounded-3xl p-6 sm:p-8 shadow-2xl backdrop-blur-sm relative overflow-hidden">
                            
                            <div class="absolute top-0 left-0 w-1 h-full ${isCorrect ? 'bg-green-500' : 'bg-red-500'}"></div>
                            
                            <div class="mb-4">
                                <span class="text-xs font-bold tracking-widest uppercase ${isCorrect ? 'text-green-400' : 'text-red-400'}">
                                    ${isCorrect ? '<i class="fa-solid fa-check mr-1"></i> Correct' : '<i class="fa-solid fa-xmark mr-1"></i> Incorrect'}
                                </span>
                            </div>
                            
                            <h3 class="text-lg text-white mb-4 opacity-80">${q.q}</h3>
                            
                            <div class="bg-[#080D1A] rounded-xl p-4 border border-white/5 mb-6">
                                <p class="text-app-muted text-sm leading-relaxed"><span class="text-white font-medium">Why?</span> ${q.reason}</p>
                            </div>

                            <button onclick="app.nextQuestion()" class="w-full bg-app-primary hover:bg-blue-600 text-white font-medium py-3 rounded-xl transition-colors">
                                ${state.currentQIndex === 9 ? 'Finish Assessment' : 'Next Question'}
                            </button>
                        </div>
                    </div>
                `;
            },

            nextQuestion: () => {
                state.currentQIndex++;
                if (state.currentQIndex >= 10) {
                    app.navigate('summary');
                } else {
                    app.renderQuiz();
                }
            },

            renderSummary: () => {
                const timeStr = globalTimerEl.innerText;
                const efficiency = Math.round((state.score / 10) * 100);
                
                let reviewHtml = '<div class="space-y-4 mt-8">';
                state.answers.forEach((ans, i) => {
                    reviewHtml += `
                        <div class="bg-app-input border border-white/5 rounded-xl p-4 text-sm">
                            <p class="text-white mb-2">${i+1}. ${ans.q}</p>
                            <p class="mb-1 ${ans.isCorrect ? 'text-green-400' : 'text-red-400'}">Your Answer: ${ans.selected}</p>
                            ${!ans.isCorrect ? `<p class="text-green-400 mb-1">Correct Answer: ${ans.correct}</p>` : ''}
                            <p class="text-app-muted italic text-xs mt-2 border-t border-white/5 pt-2">${ans.reason}</p>
                        </div>
                    `;
                });
                reviewHtml += '</div>';

                appContainer.innerHTML = `
                    <div class="bg-app-card border-t border-white/5 rounded-3xl p-6 sm:p-10 shadow-2xl backdrop-blur-sm max-w-3xl mx-auto">
                        <div class="text-center mb-8">
                            <h2 class="text-3xl font-bold text-white mb-2">Assessment Complete</h2>
                            <p class="text-app-muted">Great effort! Practice makes perfect.</p>
                        </div>

                        <div class="grid grid-cols-3 gap-4 mb-8">
                            <div class="bg-app-input rounded-2xl p-4 text-center border border-white/5">
                                <p class="text-[10px] text-app-muted tracking-widest uppercase mb-1">Score</p>
                                <p class="text-2xl font-bold text-white">${state.score}<span class="text-sm text-gray-500">/10</span></p>
                            </div>
                            <div class="bg-app-input rounded-2xl p-4 text-center border border-white/5">
                                <p class="text-[10px] text-app-muted tracking-widest uppercase mb-1">Accuracy</p>
                                <p class="text-2xl font-bold text-white">${efficiency}%</p>
                            </div>
                            <div class="bg-app-input rounded-2xl p-4 text-center border border-white/5">
                                <p class="text-[10px] text-app-muted tracking-widest uppercase mb-1">Total Time</p>
                                <p class="text-2xl font-bold text-white">${timeStr}</p>
                            </div>
                        </div>
                        
                        <div class="flex justify-center mb-8">
                            <button onclick="app.startQuizSession()" class="px-8 py-3 bg-app-primary rounded-xl text-sm font-medium text-white hover:bg-blue-600 transition-colors shadow-lg">
                                Start Another Quiz (New Questions)
                            </button>
                        </div>

                        <h3 class="text-xl font-medium text-white mb-4 border-b border-white/10 pb-2">Review Your Answers</h3>
                        ${reviewHtml}
                    </div>
                `;
            },

            downloadAnki: () => {
                let ankiContent = "";
                
                // Format: Question,Answer
                // Strict rules applied: no extra commas, colons, semi-colons.
                DATA.quiz.forEach(q => {
                    // Clean text to avoid breaking CSV format
                    let cleanQ = q.q.replace(/,/g, '').replace(/:/g, '').replace(/;/g, '').replace(/\n/g, ' ').trim();
                    let cleanA = q.correct.replace(/,/g, '').replace(/:/g, '').replace(/;/g, '').replace(/\n/g, ' ').trim();
                    ankiContent += `${cleanQ},${cleanA}\n`;
                });

                // Create blob and trigger download
                const blob = new Blob([ankiContent], { type: 'text/plain' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = 'Adverb_of_Degree_Anki.txt';
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);
                
                // Visual feedback
                const btn = document.querySelector('button[onclick="app.downloadAnki()"]');
                const oldHTML = btn.innerHTML;
                btn.innerHTML = '<i class="fa-solid fa-check text-green-400"></i> Downloaded';
                setTimeout(() => { btn.innerHTML = oldHTML; }, 2000);
            }
        };

        // Initialize App
        window.onload = app.init;

    </script>
</body>
</html>
