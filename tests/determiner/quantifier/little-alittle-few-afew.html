    {n: "sugar", type: "u", pos: "Add ___ sugar to it, just enough to make it sweet.", neg: "There is ___ sugar left; we can't even make one cup of tea."},
    {n: "ideas", type: "c", pos: "He gave ___ ideas that saved the brainstorming session.", neg: "We had ___ ideas, so the project stalled completely."},
    {n: "confidence", type: "u", pos: "She gained ___ confidence after the compliment.", neg: "He has ___ confidence left after failing repeatedly."},
    {n: "songs", type: "c", pos: "I sang ___ songs that the crowd enjoyed.", neg: "I know ___ songs by that artist; I can't go to their concert."},
    {n: "butter", type: "u", pos: "I need ___ butter to grease the pan properly.", neg: "We have ___ butter left; the cake will be dry."},
    {n: "tickets", type: "c", pos: "I bought ___ tickets so our whole family can go.", neg: "There are ___ tickets left; the event is practically sold out."},
    {n: "furniture", type: "u", pos: "We bought ___ furniture to make the living room cozy.", neg: "There is ___ furniture in the house; our voices echo off the walls."},
    {n: "clouds", type: "c", pos: "I see ___ clouds; it might provide some shade.", neg: "There are ___ clouds in the sky; the sun is blazing hot."},
    {n: "sand", type: "u", pos: "There is ___ sand in my shoes making it slightly uncomfortable.", neg: "There is ___ sand on this rocky beach to build a castle."},
    {n: "mistakes", type: "c", pos: "I made ___ mistakes, but I still got an A grade.", neg: "He made ___ mistakes; his paper was practically flawless."},
    {n: "courage", type: "u", pos: "It takes ___ courage to speak up in a meeting.", neg: "He showed ___ courage and abandoned his team in danger."},
    {n: "toys", type: "c", pos: "The kid has ___ toys to keep him occupied for the afternoon.", neg: "Those poor kids have ___ toys to play with in the shelter."},
    {n: "luggage", type: "u", pos: "I have ___ luggage, just enough for the weekend.", neg: "He brought ___ luggage, practically moving in with us!"},
    {n: "rules", type: "c", pos: "There are ___ rules to follow to keep things safe.", neg: "There are ___ rules here; it is absolute chaos."},
    {n: "dust", type: "u", pos: "There is ___ dust on the table; let me wipe it.", neg: "There is ___ dust in this clean room; it's pristine."},
    {n: "gifts", type: "c", pos: "I got ___ gifts that made me feel appreciated.", neg: "He received ___ gifts on his forgotten birthday, making him sad."},
    {n: "information", type: "u", pos: "I found ___ information to start the essay.", neg: "They gave ___ information to the police, hindering the case."},
    {n: "pens", type: "c", pos: "Can I borrow ___ pens for the exam?", neg: "I have ___ pens left; they all ran out of ink."},
    {n: "luck", type: "u", pos: "I need ___ luck to pass this difficult interview.", neg: "He had ___ luck and lost his entire life savings."},
    {n: "bottles", type: "c", pos: "Bring ___ bottles of water for the hike.", neg: "There are ___ bottles left in the store; a shortage is happening."},
    {n: "oil", type: "u", pos: "Use ___ oil to fry the onions.", neg: "There is ___ oil in the engine; it's going to seize."},
    {n: "trees", type: "c", pos: "We planted ___ trees to provide some shade.", neg: "There are ___ trees in the desert; it's mostly barren sand."},
    {n: "music", type: "u", pos: "Play ___ music to set the mood for dinner.", neg: "There is ___ music I actually enjoy on the radio nowadays."},
    {n: "keys", type: "c", pos: "I lost ___ keys, but luckily I have spares.", neg: "He has ___ keys; he relies entirely on digital locks."}
];

extraNouns.forEach(item => {
    // Add positive tonality question (Sufficiency)
    fullQuizDB.push({
        q: item.pos,
        a: item.type === "c" ? "a few" : "a little",
        type: "mcq",
        opts: ["few", "a few", "little", "a little"],
        exp: `${item.n.charAt(0).toUpperCase() + item.n.slice(1)} is ${item.type === 'c' ? 'countable' : 'uncountable'}. Context implies the speaker views the amount as SUFFICIENT (Positive attitude focusing on presence).`
    });
    // Add negative tonality question (Insufficiency)
    fullQuizDB.push({
        q: item.neg,
        a: item.type === "c" ? "few" : "little",
        type: "mcq",
        opts: ["few", "a few", "little", "a little"],
        exp: `${item.n.charAt(0).toUpperCase() + item.n.slice(1)} is ${item.type === 'c' ? 'countable' : 'uncountable'}. Context implies the speaker views the amount as INSUFFICIENT or lacking (Negative attitude focusing on absence).`
    });
});

/* ==========================================
   ROUTING & RENDER ENGINE
========================================== */
function navigateTo(view) {
    if (viewHistory[viewHistory.length - 1] !== view) {
        viewHistory.push(view);
    }
    renderView(view);
}

function navigateBack() {
    if (viewHistory.length > 1) {
        viewHistory.pop();
        renderView(viewHistory[viewHistory.length - 1]);
    }
}

function renderView(view) {
    const app = document.getElementById('app-content');
    app.innerHTML = '';

    window.scrollTo({ top: 0, behavior: 'smooth' });

    switch(view) {
        case 'home': app.innerHTML = getHomeHTML(); break;
        case 'notes': app.innerHTML = getNotesHTML(); break;
        case 'story': app.innerHTML = getStoryHTML(); break;
        case 'usage': app.innerHTML = getUsageHTML(); break;
        case 'quizSetup': app.innerHTML = getQuizSetupHTML(); break;
        case 'quizActive': renderQuizEngine(app); break;
        case 'quizResults': app.innerHTML = getResultsHTML(); break;
    }
}

function startQuiz() {
    let shuffled = [...fullQuizDB].sort(() => 0.5 - Math.random());
    currentQuizData = shuffled.slice(0, 10);
    currentQuizIndex = 0;
    userScore = 0;
    navigateTo('quizActive');
}

function renderQuizEngine(container) {
    let qData = currentQuizData[currentQuizIndex];
    let progressPct = ((currentQuizIndex) / 10) * 100;

    let html = `
        <div class="space-y-6 w-full">
            <!-- Progress Bar -->
            <div class="w-full bg-white/10 rounded-full h-2 mb-6">
                <div class="bg-brand-accent h-2 rounded-full transition-all duration-500" style="width: ${progressPct}%"></div>
            </div>
            
            <div class="flex justify-between text-xs text-gray-400 mb-2 font-mono">
                <span>Question ${currentQuizIndex + 1} of 10</span>
                <span>${qData.type === 'tf' ? 'True/False Reasoning' : 'Multiple Choice'}</span>
            </div>

            <div class="${cardClass}">
                <h2 class="text-lg font-semibold text-white leading-snug mb-6">${qData.q.replace('___', '<span class="inline-block w-12 border-b-2 border-brand-accent mx-1"></span>')}</h2>
                
                <div class="space-y-3" id="options-container">
    `;

    qData.opts.forEach(opt => {
        html += `
            <button onclick="handleAnswer('${opt}')" class="${optionClass} option-btn">
                <span>${opt}</span>
                <div class="w-5 h-5 rounded-full border border-white/20 flex items-center justify-center icon-box"></div>
            </button>
        `;
    });

    html += `
                </div>
                
                <div id="explanation-box" class="hidden mt-6 p-4 rounded-xl bg-[#0a1122] border border-white/5 border-l-4 border-l-brand-accent">
                    <p class="text-xs text-brand-accent font-bold mb-1 uppercase tracking-wider">Psychological Reasoning</p>
                    <p class="text-sm text-gray-300" id="exp-text"></p>
                    <button onclick="nextQuestion()" id="next-q-btn" class="mt-4 w-full bg-white/10 hover:bg-white/20 text-white rounded-lg py-2 text-sm transition">Next Question</button>
                </div>
            </div>
        </div>
    `;

    container.innerHTML = html;
}

function handleAnswer(selectedOpt) {
    const btns = document.querySelectorAll('.option-btn');
    btns.forEach(btn => {
        btn.onclick = null;
        btn.classList.add('cursor-not-allowed', 'opacity-50');
    });

    let qData = currentQuizData[currentQuizIndex];
    let isCorrect = selectedOpt === qData.a;
    
    if (isCorrect) userScore++;

    btns.forEach(btn => {
        let spanTxt = btn.querySelector('span').innerText;
        let iconBox = btn.querySelector('.icon-box');
        
        if (spanTxt === qData.a) {
            btn.classList.remove('opacity-50', 'bg-brand-input');
            btn.classList.add('bg-green-900/30', 'border-green-500/50', 'opacity-100');
            iconBox.innerHTML = `<svg class="w-3 h-3 text-green-400" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"></path></svg>`;
            iconBox.classList.add('border-green-500/50');
        } else if (spanTxt === selectedOpt && !isCorrect) {
            btn.classList.remove('opacity-50', 'bg-brand-input');
            btn.classList.add('bg-red-900/30', 'border-red-500/50', 'opacity-100');
            iconBox.innerHTML = `<svg class="w-3 h-3 text-red-400" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg>`;
            iconBox.classList.add('border-red-500/50');
        }
    });

    document.getElementById('exp-text').innerText = qData.exp;
    document.getElementById('explanation-box').classList.remove('hidden');
    
    setTimeout(() => {
        document.getElementById('next-q-btn').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }, 100);
}

    currentQuizIndex++;
    if (currentQuizIndex < 10) {
        renderView('quizActive');
    } else {
        navigateTo('quizResults');
    }
}

// Anki CSV Generator (Strictly adhering to user rules: exactly "Question,Answer", no extra commas anywhere)
function downloadAnki() {
    let csvContent = "";
    
    fullQuizDB.forEach(q => {
        let cleanQ = q.q.replace(/[,;:\n\r]/g, " ").trim();
        let cleanA = q.a.replace(/[,;:\n\r]/g, " ").trim();
        csvContent += `${cleanQ},${cleanA}\n`;
    });

    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.setAttribute("href", url);
    link.setAttribute("download", "few_little_sufficiency_anki.csv");
    link.style.visibility = 'hidden';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}
