        // Render Article Section
        function renderArticle() {
            const container = document.getElementById('article-content');
            container.innerHTML = '';
            
            articleData.forEach((sentenceData, sIdx) => {
                const p = document.createElement('p');
                
                sentenceData.phrases.forEach((phrase, pIdx) => {
                    const span = document.createElement('span');
                    span.textContent = phrase.text + " ";
                    span.className = "border-b border-dashed border-gray-500 cursor-pointer hover:text-[#2563EB] hover:bg-white/5 transition-colors duration-200 rounded px-1 -mx-1";
                    span.onclick = () => openModal(sIdx, pIdx);
                    p.appendChild(span);
                });
                
                container.appendChild(p);
            });
        }

        // Render Vocab Section
        function renderMainVocab() {
            const container = document.getElementById('main-vocab-list');
            mainVocabData.forEach(item => {
                container.innerHTML += `
                    <div class="bg-[#080D1A] border border-white/5 p-4 rounded-xl hover:bg-white/5 transition-colors">
                        <div class="flex justify-between items-center mb-1">
                            <span class="font-bold text-white text-lg">${item.word}</span>
                            <span class="text-sm text-gray-400">${item.meaning}</span>
                        </div>
                        <div class="text-sm text-gray-300 mt-2">
                            <p><span class="text-[#2563EB] font-semibold">In context:</span> ${item.context}</p>
                            <p class="mt-1"><span class="text-gray-500">Other usage:</span> ${item.usage}</p>
                        </div>
                    </div>
                `;
            });
        }

        // Render Grammar Section
        function renderMainGrammar() {
            const container = document.getElementById('main-grammar-list');
            mainGrammarData.forEach((item, idx) => {
                container.innerHTML += `
                    <div class="bg-[#080D1A] border border-white/5 rounded-xl overflow-hidden">
                        <button onclick="toggleAccordion('grammar-${idx}')" class="w-full text-left p-4 font-bold text-white hover:bg-white/5 flex justify-between items-center transition-colors">
                            ${item.title}
                            <svg id="icon-grammar-${idx}" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="transition-transform duration-200"><path d="m6 9 6 6 6-6"/></svg>
                        </button>
                        <div id="grammar-${idx}" class="hidden px-4 pb-4 text-sm text-gray-300 space-y-2">
                            <p><span class="text-gray-400 font-semibold block mb-1">Rule:</span> ${item.rule}</p>
                            <p><span class="text-[#2563EB] font-semibold block mb-1">Example:</span> ${item.example}</p>
                        </div>
                    </div>
                `;
            });
        }

        function toggleAccordion(id) {
            const content = document.getElementById(id);
            const icon = document.getElementById('icon-' + id);
            if (content.classList.contains('hidden')) {
                content.classList.remove('hidden');
                icon.classList.add('rotate-180');
            } else {
                content.classList.add('hidden');
                icon.classList.remove('rotate-180');
            }
        }

        // --- MODAL LOGIC ---
        function openModal(sIdx, pIdx) {
            currentModalSentence = articleData[sIdx];
            currentModalPhrase = currentModalSentence.phrases[pIdx];

            document.getElementById('modal-title').textContent = currentModalPhrase.text;
            
            // Populate Vocab
            const vocabContainer = document.getElementById('content-vocab');
            vocabContainer.innerHTML = '';
            currentModalPhrase.vocab.forEach(v => {
                vocabContainer.innerHTML += `
                    <div class="bg-white/5 p-3 rounded-lg border border-white/5">
                        <div class="flex justify-between items-start mb-1">
                            <span class="font-bold text-[#2563EB]">${v.word}</span>
                            <span class="text-xs bg-[#111A2C] px-2 py-1 rounded text-gray-400">${v.pos}</span>
                        </div>
                        <p class="text-white text-sm mb-1">${v.meaning}</p>
                        <p class="text-gray-400 text-xs">${v.detail}</p>
                    </div>
                `;
            });

            // Populate Grammar
            document.getElementById('content-grammar').innerHTML = `<div class="bg-white/5 p-4 rounded-lg border border-white/5"><p>${currentModalPhrase.grammar}</p></div>`;

            // Populate Full Sentence
            document.getElementById('content-sentence').innerHTML = `
                <div class="space-y-4">
                    <div class="bg-white/5 p-4 rounded-lg border border-white/5">
                        <h4 class="text-gray-500 text-xs uppercase tracking-wider mb-2 font-bold">English</h4>
                        <p class="text-white">${currentModalSentence.fullSentence}</p>
                    </div>
                    <div class="bg-[#2563EB]/10 p-4 rounded-lg border border-[#2563EB]/20">
                        <h4 class="text-[#2563EB] text-xs uppercase tracking-wider mb-2 font-bold">Meaning</h4>
                        <p class="text-gray-200">${currentModalSentence.fullMeaning}</p>
                    </div>
                </div>
            `;

            switchTab('vocab');
            
            const modal = document.getElementById('phrase-modal');
            const box = document.getElementById('modal-box');
            modal.classList.remove('hidden');
            // Small delay for transition
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                box.classList.remove('scale-95');
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('phrase-modal');
            const box = document.getElementById('modal-box');
            modal.classList.add('opacity-0');
            box.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        function switchTab(tabId) {
            ['vocab', 'grammar', 'sentence'].forEach(id => {
                document.getElementById('tab-' + id).className = "flex-1 py-2 text-sm font-bold rounded-lg text-gray-400 hover:text-white transition-colors";
                document.getElementById('content-' + id).classList.add('hidden');
            });
            
            document.getElementById('tab-' + tabId).className = "flex-1 py-2 text-sm font-bold rounded-lg bg-[#2563EB] text-white transition-colors";
            document.getElementById('content-' + tabId).classList.remove('hidden');
        }

        // --- QUIZ LOGIC ---
        function renderQuizQuestion() {
            const container = document.getElementById('quiz-container');
            const progressText = document.getElementById('quiz-progress-text');
            const progressBar = document.getElementById('quiz-progress-bar');
            
            if (currentQuizIndex >= quizData.length) {
                // Quiz End
                container.innerHTML = `
                    <div class="text-center space-y-4">
                        <div class="w-16 h-16 bg-[#2563EB]/20 rounded-full flex items-center justify-center mx-auto mb-4">
                            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></svg>
                        </div>
                        <h3 class="text-2xl font-bold text-white">Quiz Complete!</h3>
                        <p class="text-gray-400">Great job reviewing the article.</p>
                        <button onclick="resetQuiz()" class="mt-4 bg-[#2563EB] text-white px-6 py-3 rounded-xl font-bold hover:bg-blue-600 transition-colors w-full sm:w-auto">Retake Quiz</button>
                    </div>
                `;
                return;
            }

            const q = quizData[currentQuizIndex];
            progressText.innerText = `${currentQuizIndex + 1} / ${quizData.length}`;
            progressBar.style.width = `${((currentQuizIndex + 1) / quizData.length) * 100}%`;

            let html = '';

            if (q.type === 'mcq') {
                html = `
                    <h3 class="text-lg font-semibold text-white mb-6">${q.q}</h3>
                    <div class="space-y-3" id="options-container">
                        ${q.options.map((opt, idx) => `
                            <button onclick="handleMCQ(${idx}, ${q.correct})" id="opt-${idx}" class="w-full text-left p-4 rounded-xl bg-[#080D1A] border border-white/5 hover:bg-white/10 transition-colors text-gray-200">
                                ${opt}
                            </button>
                        `).join('')}
                    </div>
                    <div id="quiz-feedback" class="hidden mt-6 p-4 rounded-xl border"></div>
                    <button id="next-btn" onclick="nextQuestion()" class="hidden mt-6 w-full bg-[#2563EB] text-white py-3 rounded-xl font-bold hover:bg-blue-600 transition-colors">Next Question</button>
                `;
            } else if (q.type === 'tf') {
                html = `
                    <div class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">True or False</div>
                    <h3 class="text-lg font-semibold text-white mb-6">${q.q}</h3>
                    <div class="grid grid-cols-2 gap-4" id="options-container">
                        <button onclick="handleTF(true, ${q.a}, '${q.exp.replace(/'/g, "\\'")}')" id="tf-true" class="p-4 rounded-xl bg-[#080D1A] border border-white/5 hover:bg-white/10 transition-colors text-center text-white font-bold">True</button>
                        <button onclick="handleTF(false, ${q.a}, '${q.exp.replace(/'/g, "\\'")}')" id="tf-false" class="p-4 rounded-xl bg-[#080D1A] border border-white/5 hover:bg-white/10 transition-colors text-center text-white font-bold">False</button>
                    </div>
                    <div id="quiz-feedback" class="hidden mt-6 p-4 rounded-xl border"></div>
                    <button id="next-btn" onclick="nextQuestion()" class="hidden mt-6 w-full bg-[#2563EB] text-white py-3 rounded-xl font-bold hover:bg-blue-600 transition-colors">Next Question</button>
                `;
            } else if (q.type === 'flash') {
                html = `
                    <div class="text-xs font-bold text-[#2563EB] uppercase tracking-wider mb-4 text-center">Flashcard</div>
                    
                    <div class="relative w-full h-48 perspective-1000 cursor-pointer group" onclick="flipCard()">
                        <div id="flashcard-inner" class="w-full h-full relative transform-style-3d transition-transform duration-500">
                            <!-- Front -->
                            <div class="absolute w-full h-full backface-hidden bg-[#080D1A] border border-white/5 rounded-xl p-6 flex flex-col justify-center items-center shadow-lg group-hover:border-white/20 transition-colors">
                                <span class="text-lg text-center text-white font-semibold">${q.front}</span>
                                <span class="text-xs text-gray-500 mt-4 absolute bottom-4">Tap to flip</span>
                            </div>
                            <!-- Back -->
                            <div class="absolute w-full h-full backface-hidden rotate-y-180 bg-[#2563EB]/10 border border-[#2563EB]/30 rounded-xl p-6 flex flex-col justify-center items-center shadow-lg">
                                <span class="text-xl text-center text-white font-bold">${q.back}</span>
                            </div>
                        </div>
                    </div>

                    <div id="flash-actions" class="hidden mt-8 grid grid-cols-2 gap-4">
                        <button onclick="nextQuestion()" class="p-3 rounded-xl bg-gray-800 text-white font-bold hover:bg-gray-700 transition-colors">Needs Review</button>
                        <button onclick="nextQuestion()" class="p-3 rounded-xl bg-[#2563EB] text-white font-bold hover:bg-blue-600 transition-colors">Got it</button>
                    </div>
                `;
            }

            container.innerHTML = html;
        }

        function handleMCQ(selectedIndex, correctIndex) {
            const container = document.getElementById('options-container');
            const buttons = container.querySelectorAll('button');
            const feedback = document.getElementById('quiz-feedback');
            const nextBtn = document.getElementById('next-btn');

            buttons.forEach(btn => btn.disabled = true);

            if (selectedIndex === correctIndex) {
                document.getElementById('opt-' + selectedIndex).classList.add('bg-green-900/30', 'border-green-500/50', 'text-green-400');
                feedback.innerHTML = `<span class="font-bold text-green-400">Correct!</span>`;
                feedback.classList.add('block', 'bg-green-900/10', 'border-green-500/20');
            } else {
                document.getElementById('opt-' + selectedIndex).classList.add('bg-red-900/30', 'border-red-500/50', 'text-red-400');
                document.getElementById('opt-' + correctIndex).classList.add('bg-green-900/30', 'border-green-500/50', 'text-green-400');
                feedback.innerHTML = `<span class="font-bold text-red-400">Incorrect.</span>`;
                feedback.classList.add('block', 'bg-red-900/10', 'border-red-500/20');
            }
            
            feedback.classList.remove('hidden');
            nextBtn.classList.remove('hidden');
        }

        function handleTF(selectedAns, correctAns, explanation) {
            const container = document.getElementById('options-container');
            const buttons = container.querySelectorAll('button');
            const feedback = document.getElementById('quiz-feedback');
            const nextBtn = document.getElementById('next-btn');

            buttons.forEach(btn => btn.disabled = true);

            const selectedBtnId = selectedAns ? 'tf-true' : 'tf-false';
            const correctBtnId = correctAns ? 'tf-true' : 'tf-false';

            if (selectedAns === correctAns) {
                document.getElementById(selectedBtnId).classList.add('bg-green-900/30', 'border-green-500/50', 'text-green-400');
                feedback.innerHTML = `<span class="font-bold text-green-400 block mb-1">Correct!</span> <span class="text-sm text-gray-300">${explanation}</span>`;
                feedback.classList.add('block', 'bg-green-900/10', 'border-green-500/20');
            } else {
                document.getElementById(selectedBtnId).classList.add('bg-red-900/30', 'border-red-500/50', 'text-red-400');
                document.getElementById(correctBtnId).classList.add('bg-green-900/30', 'border-green-500/50', 'text-green-400');
                feedback.innerHTML = `<span class="font-bold text-red-400 block mb-1">Incorrect.</span> <span class="text-sm text-gray-300">${explanation}</span>`;
                feedback.classList.add('block', 'bg-red-900/10', 'border-red-500/20');
            }

            feedback.classList.remove('hidden');
            nextBtn.classList.remove('hidden');
        }

        function flipCard() {
            const inner = document.getElementById('flashcard-inner');
            const actions = document.getElementById('flash-actions');
            
            // Only flip once per question
            if (!inner.classList.contains('rotate-y-180')) {
                inner.classList.add('rotate-y-180');
                setTimeout(() => {
                    actions.classList.remove('hidden');
                }, 300);
            }
        }

        function nextQuestion() {
            currentQuizIndex++;
            renderQuizQuestion();
        }

        function resetQuiz() {
            currentQuizIndex = 0;
            renderQuizQuestion();
        }

    </script>
</body>
</html>
