                        <button onclick="downloadAnki()" class="bg-white/10 hover:bg-white/20 text-white text-xs py-2 rounded-lg transition-colors">Download Anki CSV</button>
                    </div>
                    
                    <button onclick="navigateTo('quiz_active')" class="w-full bg-[#2563EB] text-white rounded-xl p-5 hover:bg-blue-600 transition-colors font-bold shadow-lg shadow-blue-500/20 mt-4">
                        Start Quiz (10 Questions)
                    </button>
                </div>
            `;
        }

        // ==========================================
        // QUIZ ENGINE
        // ==========================================

        function startQuizEngine() {
            // Setup state
            let shuffled = [...quizBank].sort(() => 0.5 - Math.random());
            currentQuizQuestions = shuffled.slice(0, 10);
            currentQuestionIndex = 0;
            score = 0;
            timeElapsedInSeconds = 0;
            
            // Start timer
            clearInterval(quizTimerInterval);
            quizTimerInterval = setInterval(() => {
                timeElapsedInSeconds++;
                const timerEl = document.getElementById('quiz-timer-display');
                if(timerEl) timerEl.innerText = formatTime(timeElapsedInSeconds);
            }, 1000);

            renderCurrentQuestion();
        }

        function renderCurrentQuestion() {
            if (currentQuestionIndex >= currentQuizQuestions.length) {
                finishQuiz();
                return;
            }

            const qData = currentQuizQuestions[currentQuestionIndex];
            // Determine question type implicitly by content to generate options
            let options = [];
            if(qData.a === "True" || qData.a === "False") {
                options = ["True", "False"];
            } else if(qData.a.toLowerCase() === "do" || qData.a.toLowerCase() === "does" || qData.a.toLowerCase() === "did") {
                options = ["do", "does", "did"];
                // capitalize if needed
                if(qData.a === "Do" || qData.a === "Does" || qData.a === "Did") {
                    options = ["Do", "Does", "Did"];
                }
            } else {
                // Generative distractor for fix/reasoning
                options = [qData.a, "Option varies - See reason", "Wrong construct"];
                options = options.sort(() => 0.5 - Math.random());
            }

            let progressWidth = ((currentQuestionIndex) / 10) * 100;

            let html = `
                <div class="space-y-6 fade-in h-full flex flex-col relative">
                    <!-- Timer (Does not refresh page, updated via interval) -->
                    <div class="absolute top-0 right-0 bg-[#080D1A] border border-white/5 px-3 py-1 rounded-lg">
                        <span id="quiz-timer-display" class="text-xs text-blue-400 font-mono">${formatTime(timeElapsedInSeconds)}</span>
                    </div>

                    <div class="space-y-2 mt-8">
                        <div class="flex justify-between text-xs text-gray-500 font-semibold uppercase">
                            <span>Question ${currentQuestionIndex + 1} of 10</span>
                        </div>
                        <div class="w-full bg-white/10 rounded-full h-1.5">
                            <div class="bg-[#2563EB] h-1.5 rounded-full transition-all duration-300" style="width: ${progressWidth}%"></div>
                        </div>
                    </div>

                    <h3 class="text-xl font-bold text-white mt-4 leading-snug">${qData.q}</h3>

                    <div class="space-y-3 flex-grow mt-4" id="options-container">
                        ${options.map((opt, i) => `
                            <button onclick="checkAnswer('${opt.replace(/'/g, "\\'")}')" class="w-full text-left bg-[#080D1A] border border-white/5 rounded-xl p-4 hover:bg-white/10 transition-colors text-gray-300 font-medium">
                                ${opt}
                            </button>
                        `).join('')}
                    </div>

                    <div id="explanation-box" class="hidden mt-4 bg-[#080D1A] border-l-4 border-[#2563EB] p-4 rounded-r-xl">
                        <p id="explanation-text" class="text-sm text-gray-300"></p>
                        <button onclick="nextQuestion()" class="mt-4 bg-[#2563EB] text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-blue-600 transition-colors w-full">Next</button>
                    </div>
                    
                    <button onclick="navigateTo('notes')" class="text-xs text-gray-500 hover:text-white underline text-center mt-4">Need help? Read notes</button>
                </div>
            `;

            container.innerHTML = `<div class="main-card bg-[#111A2C] rounded-3xl p-6 border-t border-white/5 shadow-2xl h-[450px] flex flex-col">${html}</div>`;
        }

        function checkAnswer(selectedOpt) {
            const qData = currentQuizQuestions[currentQuestionIndex];
            const isCorrect = selectedOpt === qData.a;
            if(isCorrect) score++;

            // Disable all option buttons
            const btns = document.querySelectorAll('#options-container button');
            btns.forEach(btn => {
                btn.disabled = true;
                if(btn.innerText.trim() === qData.a) {
                    btn.classList.add('bg-green-900/40', 'border-green-500/50', 'text-green-400');
                    btn.classList.remove('bg-[#080D1A]', 'border-white/5');
                } else if(btn.innerText.trim() === selectedOpt && !isCorrect) {
                    btn.classList.add('bg-red-900/40', 'border-red-500/50', 'text-red-400');
                    btn.classList.remove('bg-[#080D1A]', 'border-white/5');
                }
            });

            // Show explanation
            const explBox = document.getElementById('explanation-box');
            const explText = document.getElementById('explanation-text');
            explText.innerHTML = `<strong class="${isCorrect ? 'text-green-400' : 'text-red-400'}">${isCorrect ? 'Correct!' : 'Incorrect.'}</strong> ${qData.expl}`;
            explBox.classList.remove('hidden');
            explBox.classList.add('fade-in');
        }

        function nextQuestion() {
            currentQuestionIndex++;
            renderCurrentQuestion();
        }

        function finishQuiz() {
            clearInterval(quizTimerInterval);
            let efficiency = Math.round((score / 10) * 100);
            
            let message = "";
            if(efficiency >= 80) message = "Excellent work! You've mastered this concept.";
            else if(efficiency >= 50) message = "Good effort, but review the rules and top mistakes.";
            else message = "Don't worry, keep practicing. Read the notes section again.";

            let html = `
                <div class="space-y-6 text-center fade-in">
                    <h2 class="text-2xl font-bold text-white">Quiz Completed</h2>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div class="bg-[#080D1A] border border-white/5 rounded-xl p-4">
                            <p class="text-xs text-gray-500 uppercase font-semibold">Score</p>
                            <p class="text-3xl font-bold text-[#2563EB]">${score}/10</p>
                        </div>
                        <div class="bg-[#080D1A] border border-white/5 rounded-xl p-4">
                            <p class="text-xs text-gray-500 uppercase font-semibold">Time</p>
                            <p class="text-3xl font-bold text-white">${formatTime(timeElapsedInSeconds)}</p>
                        </div>
                    </div>
                    
                    <div class="bg-[#080D1A] border border-white/5 rounded-xl p-4 text-sm text-gray-300">
                        <p class="mb-2"><strong>Efficiency:</strong> ${efficiency}%</p>
                        <p>${message}</p>
                    </div>

                    <div class="space-y-3 pt-4">
                        <button onclick="navigateTo('quiz_active')" class="w-full bg-[#2563EB] text-white rounded-xl p-4 hover:bg-blue-600 transition-colors font-bold shadow-lg shadow-blue-500/20">
                            Practice More New Questions
                        </button>
                        <button onclick="navigateTo('notes')" class="w-full bg-transparent border border-white/10 text-white rounded-xl p-4 hover:bg-white/5 transition-colors font-semibold">
                            Review Notes
                        </button>
                    </div>
                </div>
            `;
            container.innerHTML = `<div class="main-card bg-[#111A2C] rounded-3xl p-6 border-t border-white/5 shadow-2xl">${html}</div>`;
        }

        // ==========================================
        // UTILITIES
        // ==========================================
        function formatTime(totalSeconds) {
            const m = Math.floor(totalSeconds / 60).toString().padStart(2, '0');
            const s = (totalSeconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function downloadAnki() {
            // User Persona constraint: "Do not use a comma in context other than a value separator."
            let csvContent = "";
            quizBank.forEach(q => {
                // Strip all commas from text completely.
                let safeQ = q.q.replace(/,/g, '');
                let safeA = q.a.replace(/,/g, '');
                csvContent += `${safeQ},${safeA}\n`;
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", "fluency_dummy_aux_anki.csv");
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Initialize App
        window.onload = () => {
            renderView('dashboard');
        };

    </script>
</body>
</html>

```
