                        <li class="flex items-center gap-2"><svg class="w-4 h-4 text-green-400" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"></path></svg> Yesterday morning</li>
                        <li class="flex items-center gap-2"><svg class="w-4 h-4 text-red-400" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg> <span class="line-through">Yesterday night</span> &rarr; <strong class="text-white">LAST NIGHT</strong></li>
                    </ul>
                    <p class="text-xs bg-white/5 p-3 rounded-lg border border-white/5">Example: <em>Last night I slept at 2 AM.</em> (Yesterday night galat hai)</p>
                </div>

                <!-- Rule 5 -->
                <div class="space-y-3">
                    <h2 class="text-xl font-bold text-white">5. Tomorrow Night</h2>
                    <p>Aane wali raat ke liye "Tomorrow night" bilkul sahi hai. Yahan koi exception nahi hai.</p>
                </div>

            </div>
        </div>
    `;
}

function renderStory() {
    return `
        <div class="brand-card bg-brand-card border-t border-white/5 shadow-2xl rounded-3xl p-6 sm:p-8 space-y-6">
            <h1 class="text-2xl font-bold text-white">Story: Rahul's Busy Shift</h1>
            
            <div class="prose prose-invert prose-p:text-gray-400 prose-strong:text-brand-blue prose-strong:bg-brand-blue/10 prose-strong:px-1 prose-strong:rounded">
                <p>Rahul is a software engineer in Pune. He has a very tight schedule. He usually wakes up early <strong>in the morning</strong> to avoid traffic. However, he often leaves the office late and travels back home <strong>at night</strong>.</p>
                
                <p><strong>This morning</strong>, his manager gave him an urgent project. He had to skip his lunch <strong>in the afternoon</strong>. Because of this deadline, he told his friends, "I cannot meet you guys <strong>tonight</strong>. I have to deploy the code."</p>

                <p>His friend replied, "But you promised! We didn't meet <strong>yesterday evening</strong> either. You said you were sleeping <strong>last night</strong> because you were tired!"</p>

                <p>Rahul sighed. "I know, I know. I woke up <strong>in the night</strong> around 3 AM to fix a server bug. Let's definitely meet <strong>tomorrow night</strong> after my shift ends."</p>
            </div>

            <div class="mt-8 pt-6 border-t border-white/5">
                <button onclick="startQuiz()" class="w-full py-3 bg-brand-blue text-white rounded-xl font-bold shadow-lg shadow-blue-500/20">Test What You Read</button>
            </div>
        </div>
    `;
}

function renderIRL() {
    let items = '';
    const slice = irlScenarios.slice(state.irlIndex, state.irlIndex + 5);
    
    slice.forEach((scenario, idx) => {
        items += `
            <div class="bg-brand-input border border-white/5 rounded-2xl p-4 sm:p-5 group">
                <div class="flex justify-between items-start gap-4">
                    <div class="space-y-1">
                        <p class="text-xs text-brand-blue font-bold uppercase tracking-wider">Context</p>
                        <p class="text-sm text-gray-400">${scenario.context}</p>
                    </div>
                    <button onclick="toggleIRLAnswer(${idx})" class="p-2 bg-white/5 hover:bg-white/10 rounded-xl transition-colors">
                        <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                    </button>
                </div>
                <div id="irl-ans-${idx}" class="hidden mt-4 pt-4 border-t border-white/5">
                    <p class="text-lg font-serif italic text-white">${scenario.eng}</p>
                </div>
            </div>
        `;
    });

    return `
        <div class="brand-card bg-brand-card border-t border-white/5 shadow-2xl rounded-3xl p-6 sm:p-8 space-y-6">
            <div class="flex justify-between items-center">
                <h1 class="text-2xl font-bold text-white">Daily Scenarios</h1>
                <span class="text-sm text-gray-500">${state.irlIndex + 1}-${Math.min(state.irlIndex + 5, 50)} of 50</span>
            </div>
            
            <div class="space-y-4">
                ${items}
            </div>

            <div class="flex justify-between pt-4">
                <button onclick="shuffleIRL(-5)" class="${state.irlIndex === 0 ? 'opacity-30 pointer-events-none' : ''} px-4 py-2 bg-brand-input rounded-xl text-gray-400 hover:text-white border border-white/5 text-sm font-semibold">Previous</button>
                <button onclick="shuffleIRL(5)" class="${state.irlIndex >= 45 ? 'opacity-30 pointer-events-none' : ''} px-4 py-2 bg-brand-blue rounded-xl text-white shadow-lg shadow-blue-500/20 text-sm font-semibold">Next 5 Scenarios</button>
            </div>
        </div>
    `;
}

function toggleIRLAnswer(idx) {
    const el = document.getElementById(`irl-ans-${idx}`);
    if(el.classList.contains('hidden')) {
        el.classList.remove('hidden');
        el.classList.add('fade-in');
    } else {
        el.classList.add('hidden');
    }
}

function shuffleIRL(dir) {
    state.irlIndex += dir;
    if(state.irlIndex < 0) state.irlIndex = 0;
    if(state.irlIndex > 45) state.irlIndex = 45;
    render();
}

// ==========================================
// 8. QUIZ ENGINE
// ==========================================

function startQuiz() {
    // Shuffle and pick 10
    const shuffled = [...quizBank].sort(() => 0.5 - Math.random());
    state.quizQuestions = shuffled.slice(0, 10);
    state.currentQIndex = 0;
    state.score = 0;
    state.quizStartTime = state.timeSeconds;
    navigate('quiz');
}

function renderQuiz() {
    const q = state.quizQuestions[state.currentQIndex];
    const progress = ((state.currentQIndex) / 10) * 100;

    let optionsHtml = '';
    // Shuffle options for MCQ
    const shuffledOptions = [...q.options].sort(() => 0.5 - Math.random());
    
    shuffledOptions.forEach(opt => {
        optionsHtml += `
            <button onclick="selectQuizAnswer(this, '${opt}')" class="quiz-option w-full text-left p-4 rounded-xl bg-brand-input border border-white/5 hover:bg-white/10 transition-colors text-gray-300">
                ${opt}
            </button>
        `;
    });

    return `
        <div class="brand-card bg-brand-card border-t border-white/5 shadow-2xl rounded-3xl p-6 sm:p-8 space-y-8">
            <!-- Progress -->
            <div class="space-y-2">
                <div class="flex justify-between text-xs font-semibold text-gray-500">
                    <span>Question ${state.currentQIndex + 1} of 10</span>
                </div>
                <div class="w-full h-1.5 bg-white/10 rounded-full overflow-hidden">
                    <div class="h-full bg-brand-blue transition-all duration-500" style="width: ${progress}%"></div>
                </div>
            </div>

            <!-- Question -->
            <div class="space-y-6">
                <h2 class="text-xl sm:text-2xl font-bold text-white leading-snug">${q.q}</h2>
                <div class="space-y-3" id="options-container">
                    ${optionsHtml}
                </div>
            </div>

            <!-- Feedback (Hidden initially) -->
            <div id="quiz-feedback" class="hidden rounded-xl p-5 border fade-in">
                <p id="feedback-title" class="font-bold text-lg mb-1"></p>
                <p id="feedback-reason" class="text-sm text-gray-300"></p>
                <button onclick="nextQuestion()" class="mt-4 px-5 py-2 bg-brand-input hover:bg-white/10 border border-white/5 rounded-xl text-white text-sm font-semibold transition-colors">Continue</button>
            </div>
        </div>
    `;
}

function selectQuizAnswer(btnElement, selected) {
    const q = state.quizQuestions[state.currentQIndex];
    const isCorrect = selected === q.a;
    
    // Disable all buttons
    const btns = document.querySelectorAll('.quiz-option');
    btns.forEach(b => {
        b.disabled = true;
        b.classList.remove('hover:bg-white/10', 'bg-brand-input');
        if (b.textContent.trim() === q.a) {
            b.classList.add('bg-green-500/20', 'border-green-500/50', 'text-green-300'); // Highlight correct
        } else {
            b.classList.add('opacity-40');
        }
    });

    if (isCorrect) {
        state.score++;
    } else {
        btnElement.classList.remove('opacity-40');
        btnElement.classList.add('bg-red-500/20', 'border-red-500/50', 'text-red-300'); // Highlight wrong
    }

    // Show feedback
    const feedbackEl = document.getElementById('quiz-feedback');
    const titleEl = document.getElementById('feedback-title');
    const reasonEl = document.getElementById('feedback-reason');

    feedbackEl.classList.remove('hidden');
    if (isCorrect) {
        feedbackEl.classList.add('bg-green-500/10', 'border-green-500/20');
        titleEl.textContent = "Correct!";
        titleEl.classList.add('text-green-400');
    } else {
        feedbackEl.classList.add('bg-red-500/10', 'border-red-500/20');
        titleEl.textContent = "Incorrect";
        titleEl.classList.add('text-red-400');
    }
    reasonEl.textContent = q.reason;
}

function nextQuestion() {
    state.currentQIndex++;
    if (state.currentQIndex >= 10) {
        navigate('results');
    } else {
        render();
    }
}

// ==========================================
// 9. RESULTS & ANKI EXPORT
// ==========================================

function renderResults() {
    const timeTaken = state.timeSeconds - state.quizStartTime;
    const mins = Math.floor(timeTaken / 60);
    const secs = timeTaken % 60;
    const eff = (state.score / (timeTaken || 1)) * 100;

    let msg = state.score >= 8 ? "Excellent Job!" : state.score >= 5 ? "Good Effort!" : "Needs Revision";

    return `
        <div class="brand-card bg-brand-card border-t border-white/5 shadow-2xl rounded-3xl p-6 sm:p-8 space-y-8 text-center fade-in">
            <h1 class="text-3xl font-bold text-white">${msg}</h1>
            
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-brand-input border border-white/5 rounded-2xl p-4">
                    <p class="text-xs text-gray-500 font-bold uppercase tracking-widest mb-1">Score</p>
                    <p class="text-3xl font-serif italic text-brand-blue">${state.score}<span class="text-lg text-gray-500 not-italic">/10</span></p>
                </div>
                <div class="bg-brand-input border border-white/5 rounded-2xl p-4">
                    <p class="text-xs text-gray-500 font-bold uppercase tracking-widest mb-1">Time</p>
                    <p class="text-3xl font-serif italic text-white">${mins}m ${secs}s</p>
                </div>
            </div>

            <p class="text-sm text-gray-400">Remember, there are 100 unique questions baked into this app. Take the quiz again to face new challenges and eliminate guessing.</p>

            <div class="space-y-3 pt-4 border-t border-white/5">
                <button onclick="startQuiz()" class="w-full py-3 bg-brand-blue hover:bg-blue-500 transition-colors text-white rounded-xl font-bold shadow-lg shadow-blue-500/20">Take Another Quiz</button>
                <button onclick="downloadAnki()" class="w-full py-3 bg-brand-input border border-white/5 hover:bg-white/10 transition-colors text-white rounded-xl font-bold flex justify-center items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    Download Anki File (100 Flashcards)
                </button>
            </div>
        </div>
    `;
}

function downloadAnki() {
    // Generate CSV string strictly according to rules: Question,Answer. NO OTHER COMMAS/COLONS.
    let csvContent = "";
    
    quizBank.forEach(q => {
        // Strip out any forbidden punctuation just to be 100% compliant with strict rules
        let cleanQ = q.q.replace(/[,:;]/g, '').trim();
        let cleanA = q.a.replace(/[,:;]/g, '').trim();
        csvContent += `${cleanQ},${cleanA}\n`;
    });

    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.setAttribute("href", url);
    link.setAttribute("download", "night_prepositions_anki.csv");
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}

// Init
render();
</script>
</body>
</html>
